      summary: Load a dump into a base
      x-dbb-action: base.load
      x-dbb-token-scopes: [full]
      description: |-
        Loads a dump on top of the base's current data and, with `snapshot`, takes a snapshot. Existing branches are not affected. Answers `202` with an operation of kind `base.load`.

        **Action:** `base.load`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - {$ref: '#/components/parameters/BaseName'}
      requestBody:
        required: true
