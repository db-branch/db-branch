      x-dbb-action: base.publish
      x-dbb-token-scopes: [full]
      description: |-
        Changes the base's limits for branches made without a login: `max_branches` (0 for none, null to inherit the cluster-wide cap) and `max_ttl` (null to inherit). They apply on top of the cluster-wide settings `branch.anonymous_max`, `branch.anonymous_ttl` and `branch.anonymous_rate`. This does not make a snapshot public; see publishSnapshot.

        **Action:** `base.publish`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - {$ref: '#/components/parameters/BaseName'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatchAnonymous'}
      responses:
        '200':
          description: The updated base.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Base'}
        '400':
          description: 'invalid_request: nothing to change, or an invalid value.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/bases/{name}/snapshots:
    post:
      tags: [bases]
      operationId: snapshotBase
      summary: Take a snapshot of a base
      x-dbb-action: base.snapshot
      x-dbb-token-scopes: [full]
      description: |-
        Stops the base server cleanly, takes a new snapshot, starts it again, and copies the snapshot to the nodes that keep replicas. Answers `202` with an operation of kind `base.snapshot`. If the server does not stop cleanly no snapshot is taken (`unclean_shutdown`). Before the snapshot the database statistics are updated (phase `analyzing`).

        **Action:** `base.snapshot`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - {$ref: '#/components/parameters/BaseName'}
      responses:
        '202':
          description: Accepted. Poll the operation or follow the event stream.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location: {$ref: '#/components/headers/Location'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'unclean_shutdown. conflict: the base is not ready.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/bases/{name}/snapshots/{snapshot}:
    patch:
      tags: [bases]
      operationId: publishSnapshot
      summary: Make a snapshot public or private
      x-dbb-action: base.publish
      x-dbb-token-scopes: [full]
      description: |-
        Public snapshots can be used to create branches without a login (within the anonymous limits).

        **Action:** `base.publish`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - {$ref: '#/components/parameters/BaseName'}
        - {$ref: '#/components/parameters/SnapshotName'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatchSnapshot'}
      responses:
        '200':
          description: The updated base.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Base'}
        '400':
          description: 'invalid_request: `public` is missing.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [bases]
      operationId: deleteSnapshot
      summary: Delete a snapshot
      x-dbb-action: base.snapshot_delete
      x-dbb-token-scopes: [full]
      description: |-
        Deletes a snapshot. The latest snapshot and snapshots that branches use cannot be deleted. Older unused snapshots are also pruned automatically when `base.prune_snapshots` is on.

        **Action:** `base.snapshot_delete`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - {$ref: '#/components/parameters/BaseName'}
        - {$ref: '#/components/parameters/SnapshotName'}
      responses:
        '204': {description: Done. No content.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'conflict: it is the latest snapshot. in_use: branches use it.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/bases/{name}/mask:
