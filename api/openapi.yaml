# Generated once from the handlers in internal/interface/httpapi; now edited by hand.
# internal/interface/httpapi/openapi_test.go keeps it in step with the routes.
openapi: 3.1.0
info:
  title: db-branch API
  version: 0.2.0
  summary: 'REST API of the db-branch agent: database branches, bases, checkpoints and cluster administration.'
  description: |
    The REST API of the db-branch agent. The web console, the `db-branch` command and your own scripts all use it. This document describes the core API that every installation serves. Paid modules add their own APIs under `/v1/ext/<module>/`; each module documents its API itself, and those paths are not listed here. A node's `GET /v1/capabilities` names the modules it runs.

    # Basics

    **Base URL.** `https://<node>:7080`. Every node serves the same API on port 7080 with the same TLS certificate as the console. In a cluster any node accepts any request and passes it to the node that holds the resource; changes are forwarded to the Raft leader. The certificate is self-signed: download it from `/tls.pem` and trust it, or pass `-k` to curl while you try things out. The `db-branch` command uses the same API over the UNIX socket `/run/db-branch/agent.sock`.

    **Format.** Requests and responses are JSON (`application/json`), except where an endpoint says otherwise (uploads, backups, metrics, events, health checks). Field names are `snake_case`. Times are RFC 3339 in UTC, sizes are bytes, durations are Go-style strings such as `72h` or `30m`. A JSON request body may be at most 2 MiB and a field the API does not know is rejected with `400 invalid_request`.

    **Names.** Branches, bases and snapshots have names of lowercase letters, digits and single hyphens, starting with a letter, at most 32 characters (`feature-x`). A runtime is written `engine@version`, for example `mysql@8.4.13` or `postgres@18.6`. Names are unique across the cluster and cannot be changed.

    **Lists.** List endpoints return `{"items": [...], "next_cursor": null}` with all items in one response. There are no `limit` or `cursor` parameters; `next_cursor` is always `null`. Branches and bases are sorted by name, operations newest first.

    # Authentication

    Every request, except the few listed below, must be authenticated in one of three ways.

    | Kind | How | Who |
    |---|---|---|
    | API token | `Authorization: Bearer dbb_...` | Scripts, CI, MCP clients |
    | Session | The `dbb_session` cookie from `POST /v1/auth/login`; every request other than GET also needs the `X-CSRF-Token` header (`csrf_token` of the login answer) or it fails with `403 csrf_failed` | The web console |
    | Local socket | Connect to `/run/db-branch/agent.sock` as root or a member of the `db-branch` group; no session or CSRF token | The `db-branch` command; acts as an admin |

    Tokens start with `dbb_`, are shown once when created, and only their hash is stored. A service token is made by an admin (`POST /v1/tokens`) and acts as itself; a personal token is made by any signed-in person (`POST /v1/account/tokens`) and acts as that person. A token cannot create another. An invalid, expired or revoked token gets `401 unauthenticated`. The CSRF check does not apply to bearer tokens.

    **Token scopes.** A `branches` token (the default) may create, use and delete branches and read most other resources; it cannot change bases, runtimes, settings or tokens, and it cannot read settings, tokens, route users, backups or a base's refresh source, because those can hold secrets. A `full` token may do everything an admin can. Each operation lists the scopes that may call it in `x-dbb-token-scopes`.

    **Actions and roles.** Which calls are allowed is decided per request by an action name such as `branch.create` or `base.delete`, given for every operation in `x-dbb-action`. The built-in login is a single admin who may do everything. People other than admins (signed in through a paid module) may read all branches but change, connect to and query only their own, except `open` branches, which anyone may connect to and query; the module's roles decide the rest. The local socket and `full` tokens count as admin.

    **Without credentials** only a few calls work: creating a branch from a public snapshot, reading and connecting to an `open` branch, reading an operation, and listing public bases (operations marked as allowing anonymous access). `/healthz`, `/readyz`, `/tls.pem`, `POST /v1/auth/login` and `GET /v1/auth/methods` need no login at all.

    **Socket only.** `POST /v1/auth/reset`, `POST /v1/cluster/token` and `POST /v1/backups/restore` work only over the local socket and answer `403 socket_only` over HTTPS.

    # Errors

    A failed request returns a status code and a body of this shape. Branch on `code`; `message` is for people and may change.

    ```json
    { "error": { "code": "not_found", "message": "branch feature-x: not found" } }
    ```

    | Status | `code` | Meaning |
    |---|---|---|
    | 400 | `invalid_request` | Malformed JSON, an unknown or missing field, or an invalid name, runtime, TTL or setting |
    | 400 | `weak_password` | The new password is too weak |
    | 401 | `unauthenticated` | No session or token, or it has expired |
    | 401 | `invalid_credentials` | Wrong user name or password |
    | 403 | `forbidden` | The action is not allowed for this caller or token scope |
    | 403 | `csrf_failed` | Cookie session without a matching `X-CSRF-Token` |
    | 403 | `socket_only` | Works only on a node's local socket |
    | 403 | `managed_elsewhere` | A sign-in provider manages this password |
    | 404 | `not_found` | No such resource |
    | 404 | `runtime_not_installed` | The runtime is not installed on that node |
    | 409 | `already_exists` | The name is taken |
    | 409 | `conflict` | The resource is not in a state that allows this (for example resetting a branch that is not ready) |
    | 409 | `in_use` | Something still uses it (a base with branches, a runtime in use) |
    | 409 | `unclean_shutdown` | The base server did not stop cleanly, so no snapshot was taken |
    | 409 | `feature_not_supported` | The branch's database engine does not offer this (for example running SQL on an engine that cannot) |
    | 409 | `other_node` | The work belongs to another node |
    | 409 | `rollout_running` | A cluster update is already in progress |
    | 409 | `checkpoints_unavailable` | The node holding the branch cannot take checkpoints |
    | 409 | `not_routable`, `no_proxy`, `not_clustered`, `auto_renew_off`, `not_renewable`, `in_progress` | The feature is not set up or not applicable here |
    | 411 / 413 / 507 | `length_required`, `too_large`, `no_space` | Upload problems |
    | 422 | `runtime_unavailable` | The runtime version is not offered |
    | 422 | `upgrade_not_allowed` | The branch upgrade is not one db-branch does |
    | 422 | `query_failed` | The SQL statement failed |
    | 422 | `invalid_license`, `license_unusable`, `restore_failed` | The key or backup cannot be used |
    | 429 | `rate_limited` | Too many attempts; see `Retry-After` |
    | 501 | `not_implemented`, `cannot_verify` | Not available on this node or build |
    | 503 | `no_leader` | The cluster has no leader at the moment; retry after `Retry-After` |
    | 503 | `no_capacity` | No node has room for the branch |
    | 503 | `cluster_upgrading` | A cluster update is changing the protocol |
    | 503 | `not_initialized` | The node has not run `db-branch init`, or the feature is not set up on it |
    | 503 | `modules_pending` | This node does not yet run every module the cluster requires |
    | 500 | `internal` | Unexpected error |

    # Long-running operations

    Creating a branch, resetting, recreating, upgrading or deleting one, restoring a checkpoint, creating or snapshotting a base, loading a dump, masking or refreshing a base, and installing a runtime take from seconds to minutes. These calls answer `202 Accepted` at once, with a `Location` header and an Operation:

    ```json
    { "id": "op_01JC8Z6Q4M7V3X2N9K5R8T1W0B", "kind": "branch.create", "target": { "resource": "branch", "name": "feature-x" },
      "node": "node1", "state": "running", "phase": "cloning", "created_at": "2026-11-09T12:00:00Z", "updated_at": "2026-11-09T12:00:03Z", "seq": 1762689600000000000 }
    ```

    `state` is `running`, `succeeded` or `failed`; while it runs `phase` says where it is; on failure `error` holds the reason; `finished_at` is set once it ends. Some operations also return a `result` (a branch upgrade returns an UpgradeResult, also when it failed). The resource itself (the branch, for example) is visible right away with a `status`, so you can poll that instead. Poll `GET /v1/operations/{id}` until `state` is no longer `running`, or follow `GET /v1/events`. An operation keeps running if the client disconnects. Quick changes (starting a base, extending a branch, saving a checkpoint) finish within the request and answer `200`, `201` or `204`.

    # Not supported

    `Idempotency-Key`, `ETag` / `If-Match`, cursor pagination, filtering lists, and cancelling an operation are not implemented. Do not rely on them.

    # Example: create a branch and connect

    ```sh
    DBB=https://node1:7080/v1
    AUTH="Authorization: Bearer $DBB_TOKEN"
    OP=$(curl -sk -H "$AUTH" -H 'Content-Type: application/json' -d '{"name":"feature-x","base":"prod","ttl":"72h"}' $DBB/branches | jq -r .id)
    while [ "$(curl -sk -H "$AUTH" $DBB/operations/$OP | jq -r .state)" = running ]; do sleep 1; done
    curl -sk -H "$AUTH" $DBB/branches/feature-x/dsn
    curl -sk -X DELETE -H "$AUTH" $DBB/branches/feature-x
    ```
  license: {name: Apache-2.0, identifier: Apache-2.0}
servers:
  - url: https://{node}:7080
    description: Any node of the cluster
    variables:
      node: {default: node1.example.com, description: Host name of a node.}
  - url: http://unix
    description: The local socket /run/db-branch/agent.sock (root or the db-branch group; no session).
security:
  - bearerAuth: []
  - session: []
  - localSocket: []
tags:
  - name: branches
    x-displayName: Branches
    description: 'A branch is a writable clone of a base snapshot with a database server of its own. It is ready in seconds and costs only the space of what changes. Branches have an owner and an access mode: `private` (own password; owner and admins) or `open` (the cluster''s shared password; anyone may connect and query). A branch expires at `expires_at` and is deleted automatically. Status: `provisioning`, `ready`, `resetting`, `restoring`, `upgrading`, `deleting`, `failed`, `lost` (its node is gone; see recreate).'
  - name: checkpoints
    x-displayName: Checkpoints
    description: 'A checkpoint saves a running branch''s state (a ZFS snapshot: instant, the server keeps running) so the branch can be put back to it later. Restoring replaces the current state and does not save it: take a checkpoint first if it may be needed. Every checkpoint already taken stays restorable. Reset keeps the checkpoints; deleting the branch removes them. The setting `branch.max_checkpoints` (default 20) limits the ones you take. Needs the node''s own ZFS pool: a branch''s `checkpoints` field says whether it is possible, and the endpoints answer `409 checkpoints_unavailable` elsewhere.'
  - name: upgrades
    x-displayName: Branch upgrade
    description: Move one branch to a newer runtime of its engine (mainly MySQL 8.0 to 8.4) to test a migration, with a pre-check, an automatic checkpoint and a rollback if it fails. The base and other branches are untouched. The operation's `result` is an UpgradeResult.
  - name: bases
    x-displayName: Bases
    description: 'A base is the source branches are cloned from: a database server whose data is frozen in snapshots. Bases are created empty or from a dump, can be masked copies of other bases, and keep replicas on other nodes. A snapshot can be made public so that anyone may create a branch from it without logging in, within limits (`anonymous`). Calls for a base held by another node are passed on to that node. Status: `provisioning`, `ready`, `maintenance`, `failed`.'
  - name: refresh
    x-displayName: Scheduled refresh
    description: 'A base can be refreshed from a source database on a schedule: dump the source, load it, take a snapshot. The interval is at least one hour. The source password is stored but never returned.'
  - name: uploads
    x-displayName: Dump uploads
    description: Dumps can be sent over the API instead of being copied to a node. An upload is stored on one node and is referred to by its ID (`upload:...`) in createBase and loadBase.
  - name: operations
    x-displayName: Operations
    description: Progress records of long-running tasks. See the overview.
  - name: events
    x-displayName: Events
    description: A Server-Sent Events stream of changes to branches, bases, operations, runtimes, nodes, settings and modules.
  - name: runtimes
    x-displayName: Runtimes
    description: A runtime is a database engine version (`mysql@8.4.13`, `postgres@18.6`). In a cluster a runtime is installed on every node, so that a branch can be placed or recreated anywhere.
  - name: cluster
    x-displayName: Cluster and nodes
    description: The cluster as this node sees it, per-node metrics, the node's version and modules, and the join token.
  - name: monitoring
    x-displayName: Metrics and health
    description: Prometheus metrics and the liveness and readiness checks. The checks and the certificate are outside `/v1` and need no login.
  - name: auth
    x-displayName: Authentication
    description: Sign-in for the console. Scripts should use API tokens instead.
  - name: account
    x-displayName: Account
    description: The signed-in person's own preferences and personal tokens (for example for an MCP client).
  - name: tokens
    x-displayName: Service tokens
    description: Tokens for CI and integrations, made by an admin. Scope `branches` (default) or `full`.
  - name: route-users
    x-displayName: Proxy route users
    description: Proxy logins that open a default branch. Only on nodes that run the proxy (`db-branch-proxysql`); otherwise `409 no_proxy`. Each branch also gets a proxy user named after the branch.
  - name: settings
    x-displayName: Settings
    description: 'Cluster-wide settings, grouped in scopes: `core` for db-branch itself and one scope for each module that has settings.'
  - name: modules
    x-displayName: Modules
    description: Modules extend db-branch (history, diff, authentication, masking, ...). Turning one on installs its package on every node. The APIs and pages a module adds are served under `/v1/ext/<module>/` and documented by the module.
  - name: license
    x-displayName: Licence
    description: Paid modules work for 30 days without a key, then only under a licence key. Keys of a subscription renew online through the cluster leader.
  - name: updates
    x-displayName: Cluster updates
    description: Rolling updates of every node to a newer minor or patch version, followers first and the leader last. It stops at the first failed node and does not roll back.
  - name: backups
    x-displayName: Backups
    description: Backups of the cluster state (settings, tokens, modules, route users, runtimes, the admin password), not of the data of bases. The files contain secrets.
  - {name: mcp, x-displayName: MCP, description: The Model Context Protocol endpoint for LLM agents.}
x-tagGroups:
  - name: Databases
    tags: [branches, checkpoints, upgrades, bases, refresh, uploads]
  - name: Activity
    tags: [operations, events]
  - name: Infrastructure
    tags: [runtimes, cluster, monitoring]
  - name: Access
    tags: [auth, account, tokens, route-users]
  - name: Administration
    tags: [settings, modules, license, updates, backups]
  - name: Integrations
    tags: [mcp]
paths:
  /v1/branches:
    get:
      tags: [branches]
      operationId: listBranches
      summary: List branches
      x-dbb-action: branch.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Lists branches visible to the caller, sorted by name. Admins see every branch; non-admins see their own branches, `open` branches, and branches shared with them by a branch policy. The connection password is not included (see getBranchDsn).

        **Action:** `branch.read`. Allowed for `full` and `branches` tokens.
      responses:
        '200':
          description: The branches.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BranchList'}
              example:
                items:
                  - name: feature-x
                    id: alice/feature-x
                    owner: oidc:alice@example.com
                    owner_name: alice@example.com
                    access: private
                    status: ready
                    status_reason: null
                    base: prod
                    snapshot: s20261109
                    runtime: postgres@18.6
                    base_runtime: postgres@18.6
                    node: node1
                    created_at: '2026-11-09T12:00:00Z'
                    expires_at: '2026-11-12T12:00:00Z'
                    reset_at: null
                    storage: {used: 1048576, referenced: 83886080}
                    connection: {host: node1, port: 41203, user: feature-x}
                    proxy: {host: node1, port: 6133, user: feature-x}
                    operation: null
                    record: false
                    checkpoints: true
                next_cursor: null
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [branches]
      operationId: createBranch
      summary: Create a branch
      x-dbb-action: branch.create
      x-dbb-token-scopes: [full, branches]
      description: |-
        Clones a snapshot of a base into a new branch with a database server of its own. Answers `202` with an operation of kind `branch.create`; the branch is visible at once with status `provisioning`.

        Without a login this works only for a snapshot marked public: the branch is then always `open`, its TTL is capped at the anonymous TTL, and the number of branches (per base and in total) and the creations per client address and hour are limited (`rate_limited` with `Retry-After`). With `runtime` set, the branch is upgraded right after it is created and the operation's `result` holds the UpgradeResult.

        **Action:** `branch.create`. Allowed for `full` and `branches` tokens. Without credentials: only from a public snapshot.
      security:
        - bearerAuth: []
        - session: []
        - localSocket: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBranch'}
      responses:
        '202':
          description: Accepted. Poll the operation or follow the event stream.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location: {$ref: '#/components/headers/Location'}
        '400':
          description: 'invalid_request: malformed JSON, an unknown field, or an invalid value. Also an `access` other than `private` or `open`, and a name that does not fit in 32 characters with the owner''s prefix.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: 'forbidden: a non-admin naming another owner; a snapshot that is not public, or a base that allows no branches, without a login; `record` or `runtime` without a login; a module''s branch policy (for example team limits).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '404':
          description: 'not_found: no such base or snapshot. runtime_not_installed: `runtime` is not installed on the node.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'already_exists: names are unique across the cluster. conflict: the limit of branches without a login is reached. other_node. feature_not_supported: with `runtime`, the base''s database engine cannot be upgraded; with `record`, the engine does not declare `history_record` (before 2026-11-20 this was a 400).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: 'upgrade_not_allowed: `runtime` is not an upgrade path the branch can take. runtime_unavailable.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: 'rate_limited: too many branches created without a login from this address. See `Retry-After`.'
          headers:
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 'no_capacity: no node has room. not_initialized, cluster_upgrading, no_leader, modules_pending.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/branches/{name}:
    get:
      tags: [branches]
      operationId: getBranch
      summary: Get a branch
      x-dbb-action: branch.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Returns one branch. Admins may read every branch; non-admins may read their own branches, `open` branches, and branches shared with them by a branch policy. Without a login this works for `open` branches only.

        **Action:** `branch.read`. Allowed for `full` and `branches` tokens.
      security:
        - bearerAuth: []
        - session: []
        - localSocket: []
        - {}
      parameters:
        - {$ref: '#/components/parameters/BranchName'}
      responses:
        '200':
          description: The branch.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Branch'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
    patch:
      tags: [branches]
      operationId: extendBranch
      summary: Change a branch's expiry
      x-dbb-action: branch.extend
      x-dbb-token-scopes: [full, branches]
      description: |-
        Sets the expiry to now plus `ttl`.

        **Action:** `branch.extend`. Allowed for `full` and `branches` tokens. Allowed for the branch's owner and admins.
      parameters:
        - {$ref: '#/components/parameters/BranchName'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExtendBranch'}
      responses:
        '200':
          description: The updated branch.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Branch'}
        '400':
          description: 'invalid_request: `ttl` is not a duration.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [branches]
      operationId: deleteBranch
      summary: Delete a branch
      x-dbb-action: branch.delete
      x-dbb-token-scopes: [full, branches]
      description: |-
        Deletes the branch and its data. Answers `202` with an operation of kind `branch.delete`. A branch can be deleted when it is `ready`, `failed` or `lost`; deleting a `lost` branch is recorded here and finished when its node returns.

        **Action:** `branch.delete`. Allowed for `full` and `branches` tokens. Allowed for the branch's owner and admins.
      parameters:
        - {$ref: '#/components/parameters/BranchName'}
      responses:
        '202':
          description: Accepted. Poll the operation or follow the event stream.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location: {$ref: '#/components/headers/Location'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'conflict: the branch is in a state that does not allow deleting (for example `provisioning`).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/branches/{name}/reset:
    post:
      tags: [branches]
      operationId: resetBranch
      summary: Reset a branch
      x-dbb-action: branch.reset
      x-dbb-token-scopes: [full, branches]
      description: |-
        Discards every change and returns the branch to its state right after creation (after `init_sql`). Checkpoints are kept. Answers `202` with an operation of kind `branch.reset`. A branch that was upgraded returns to the base's runtime.

        **Action:** `branch.reset`. Allowed for `full` and `branches` tokens. Allowed for the branch's owner and admins.
      parameters:
        - {$ref: '#/components/parameters/BranchName'}
      responses:
        '202':
          description: Accepted. Poll the operation or follow the event stream.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location: {$ref: '#/components/headers/Location'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'conflict: the branch is not `ready`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/branches/{name}/pause:
    post:
      tags: [branches]
      operationId: pauseBranch
      summary: Pause a branch
      x-dbb-action: branch.update
      x-dbb-token-scopes: [full, branches]
      description: |-
        Stops the branch's database server cleanly and keeps its data: the dataset, the port and the credentials stay, nothing runs and no memory is held. Connections are refused until the branch is resumed. The expiry keeps running: a paused branch that expires is deleted. Answers `202` with an operation of kind `branch.pause`.

        Only a `ready` branch can be paused. The request is refused with `cluster_upgrading` until every node runs the version that knows the `paused` status.

        **Action:** `branch.update`. Allowed for `full` and `branches` tokens. Allowed for the branch's owner and admins.
      parameters:
        - {$ref: '#/components/parameters/BranchName'}
      responses:
        '202':
          description: Accepted. Poll the operation or follow the event stream.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location: {$ref: '#/components/headers/Location'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'conflict: the branch is not `ready`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/branches/{name}/resume:
    post:
      tags: [branches]
      operationId: resumeBranch
      summary: Resume a paused branch
      x-dbb-action: branch.update
      x-dbb-token-scopes: [full, branches]
      description: |-
        Starts a paused branch's database server again, on the same port and with the same credentials. Answers `202` with an operation of kind `branch.resume`. If the server cannot start, the branch stays `paused` with the reason in `status_reason`, and the request can be repeated.

        **Action:** `branch.update`. Allowed for `full` and `branches` tokens. Allowed for the branch's owner and admins.
      parameters:
        - {$ref: '#/components/parameters/BranchName'}
      responses:
        '202':
          description: Accepted. Poll the operation or follow the event stream.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location: {$ref: '#/components/headers/Location'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'conflict: the branch is not `paused`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/branches/{name}/recreate:
    post:
      tags: [branches]
      operationId: recreateBranch
      summary: Recreate a lost branch
      x-dbb-action: branch.recreate
      x-dbb-token-scopes: [full, branches]
      description: |-
        Builds a `lost` branch (its node is gone) again on a node that holds its snapshot. Data written to the branch after it was created is gone. Answers `202` with an operation of kind `branch.recreate`.

        **Action:** `branch.recreate`. Allowed for `full` and `branches` tokens. Allowed for the branch's owner and admins.
      parameters:
        - {$ref: '#/components/parameters/BranchName'}
        - name: node
          in: query
          description: 'The node to build it on. Default: chosen by load.'
          schema: {type: string}
      responses:
        '202':
          description: Accepted. Poll the operation or follow the event stream.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location: {$ref: '#/components/headers/Location'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'conflict: the branch is not `lost`.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 'no_capacity: no node holds the snapshot. Also not_initialized, no_leader, modules_pending.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/branches/{name}/dsn:
    get:
      tags: [branches]
      operationId: getBranchDsn
      summary: Get the connection URL
      x-dbb-action: branch.connect
      x-dbb-token-scopes: [full, branches]
      description: |-
        Returns the connection URL including the password. Every call is written to the audit log. Without a login this works for `open` branches only.

        **Action:** `branch.connect`. Allowed for `full` and `branches` tokens. Allowed for the branch's owner and admins, and for open branches anyone.
      security:
        - bearerAuth: []
        - session: []
        - localSocket: []
        - {}
      parameters:
        - {$ref: '#/components/parameters/BranchName'}
        - name: via
          in: query
          description: '`proxy` returns a URL that points at the node''s proxy port instead of the branch''s own port.'
          schema:
            type: string
            enum: [proxy]
      responses:
        '200':
          description: The URL.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Dsn'}
              example: {dsn: 'postgres://feature-x:<password>@node1:41203/postgres'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'not_routable: with `via=proxy`, the node has no proxy or the branch has no user of its own yet.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/branches/{name}/query:
    post:
      tags: [branches]
      operationId: queryBranch
      summary: Run an SQL statement on a branch
      x-dbb-action: branch.query
      x-dbb-token-scopes: [full, branches]
      description: |-
        Runs one SQL statement on a `ready` branch as the branch's own user. Changes stay in the branch. Values come back as strings; SQL NULL is null. Statements without rows return `affected` instead of `columns` and `rows`.

        **Action:** `branch.query`. Allowed for `full` and `branches` tokens. Allowed for the branch's owner and admins, and for open branches anyone.
      parameters:
        - {$ref: '#/components/parameters/BranchName'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/QueryRequest'}
      responses:
        '200':
          description: The result.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/QueryResult'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'conflict: the branch is not `ready`; or feature_not_supported: the branch''s database engine cannot run SQL.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: 'query_failed: the statement failed.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 'not_initialized: queries are not available on this node.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/branches/{name}/checkpoints:
    get:
      tags: [checkpoints]
      operationId: listCheckpoints
      summary: List a branch's checkpoints
      x-dbb-action: branch.checkpoint.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Lists the checkpoints of all lines of history, oldest first, with the structure of the lines (`lines`, `live`, `head`) so that a client can draw the history. The list is read from ZFS; the request is forwarded to the node holding the branch.

        **Action:** `branch.checkpoint.read`. Allowed for `full` and `branches` tokens. Allowed for the branch's owner and admins.
      parameters:
        - {$ref: '#/components/parameters/BranchName'}
      responses:
        '200':
          description: The checkpoints.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CheckpointList'}
              example:
                items:
                  - name: before-migration
                    created_at: '2026-11-12T15:30:00Z'
                    size: 98304
                    line: 0
                    auto: false
                    current: true
                    runtime: mysql@8.0.40
                next_cursor: null
                lines:
                  - line: 0
                    live: true
                    parent: null
                    from: ''
                live: 0
                head: before-migration
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'checkpoints_unavailable: the node holding the branch has no ZFS pool of its own for checkpoints; or feature_not_supported: the branch''s database engine has no checkpoints.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [checkpoints]
      operationId: createCheckpoint
      summary: Save a checkpoint
      x-dbb-action: branch.checkpoint
      x-dbb-token-scopes: [full, branches]
      description: |-
        Saves the branch's current state as a checkpoint. It is a ZFS snapshot: instant, and the server keeps running, so the answer is `201` with the checkpoint, not an operation. The body is optional. At most `branch.max_checkpoints` (default 20) checkpoints you take are kept; the automatic ones are not counted.

        **Action:** `branch.checkpoint`. Allowed for `full` and `branches` tokens. Allowed for the branch's owner and admins.
      parameters:
        - {$ref: '#/components/parameters/BranchName'}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateCheckpoint'}
      responses:
        '201':
          description: The new checkpoint. `warning` is set when the branch uses more than half of the pool's free space.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Checkpoint'}
        '400':
          description: 'invalid_request: invalid JSON or name.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'already_exists: the name is taken. conflict: the limit is reached, or the branch is not ready. checkpoints_unavailable. feature_not_supported: the database engine has no checkpoints.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/branches/{name}/checkpoints/{checkpoint}/restore:
    post:
      tags: [checkpoints]
      operationId: restoreCheckpoint
      summary: Restore a checkpoint
      x-dbb-action: branch.restore
      x-dbb-token-scopes: [full, branches]
      description: |-
        Puts the branch back to the checkpoint, in the background; the server restarts briefly. The current state is replaced and is not saved: take a checkpoint first if it may be needed. Every checkpoint already taken stays restorable. Restoring a checkpoint taken on another runtime switches the branch back to that runtime. Answers `202` with an operation of kind `branch.restore`; phases include `cloning`, `stopping`, `checkpointing`, `swapping`, `promoting`, `starting`.

        **Action:** `branch.restore`. Allowed for `full` and `branches` tokens. Allowed for the branch's owner and admins.
      parameters:
        - {$ref: '#/components/parameters/BranchName'}
        - {$ref: '#/components/parameters/CheckpointName'}
      responses:
        '202':
          description: Accepted. Poll the operation or follow the event stream.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location: {$ref: '#/components/headers/Location'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 'not_found: no such branch or checkpoint.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'conflict: the branch is not `ready`. checkpoints_unavailable. feature_not_supported: the database engine has no checkpoints.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/branches/{name}/checkpoints/{checkpoint}:
    delete:
      tags: [checkpoints]
      operationId: deleteCheckpoint
      summary: Delete a checkpoint
      x-dbb-action: branch.checkpoint_delete
      x-dbb-token-scopes: [full, branches]
      description: |-
        Deletes a checkpoint.

        **Action:** `branch.checkpoint_delete`. Allowed for `full` and `branches` tokens. Allowed for the branch's owner and admins.
      parameters:
        - {$ref: '#/components/parameters/BranchName'}
        - {$ref: '#/components/parameters/CheckpointName'}
      responses:
        '204': {description: Done. No content.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: conflict. checkpoints_unavailable. feature_not_supported (the database engine has no checkpoints).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/branches/{name}/upgrade:
    post:
      tags: [upgrades]
      operationId: upgradeBranch
      summary: Upgrade a branch to a newer runtime
      x-dbb-action: branch.upgrade
      x-dbb-token-scopes: [full, branches]
      description: |-
        Moves one branch to a newer runtime of its engine (mainly MySQL 8.0 to 8.4), to test a migration; the base and the other branches are untouched. Answers `202` with an operation of kind `branch.upgrade`. When it finishes, `result` is an UpgradeResult, also if the operation failed.

        With `check_only` only the pre-check runs (accounts using `mysql_native_password`, the generated configuration checked by the target server, free space) and nothing changes. Otherwise, unless the pre-check found errors (override with `force`), the server stops cleanly, the automatic checkpoint `before-upgrade-<time>` is saved, and the server starts on the new binaries. A failure restores the checkpoint and starts the old runtime again, unless `no_rollback` is set; then the branch stays `failed` with a `status_reason` that starts with `upgrade failed:`.

        Allowed: the same engine, upgrades only; MySQL 8.0 to 8.4, 8.4 to 9.x and patch upgrades (skipping a long-term-support series is refused); PostgreSQL minor upgrades within one major. The target must be installed on the branch's node. Phases: `checking`, `stopping`, `checkpointing`, `upgrading`, `rolling_back`.

        **Action:** `branch.upgrade`. Allowed for `full` and `branches` tokens. Allowed for the branch's owner and admins.
      parameters:
        - {$ref: '#/components/parameters/BranchName'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpgradeRequest'}
      responses:
        '202':
          description: Accepted. The operation's `result` will hold the UpgradeResult.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
              example:
                id: op_01JC8Z6Q4M7V3X2N9K5R8T1W0B
                kind: branch.upgrade
                target: {resource: branch, name: feature-x}
                node: node1
                state: running
                phase: cloning
                created_at: '2026-11-09T12:00:00Z'
                updated_at: '2026-11-09T12:00:03Z'
                seq: 1762689600000000000
          headers:
            Location: {$ref: '#/components/headers/Location'}
        '400':
          description: 'invalid_request: malformed JSON, an unknown field, or an invalid value.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 'not_found. runtime_not_installed: the target is not installed on the node (the message says how to install it).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'conflict: the branch is not `ready`; or feature_not_supported: the branch''s database engine cannot be upgraded.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: 'upgrade_not_allowed: a downgrade, a skipped LTS series, another engine, or a PostgreSQL major upgrade.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: 'cluster_upgrading: not every node runs a version that supports it yet. Also not_initialized, no_leader, modules_pending.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/bases:
    get:
      tags: [bases]
      operationId: listBases
      summary: List bases
      x-dbb-action: base.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Lists all bases, sorted by name. `can` tells what the caller may do with each.

        **Action:** `base.read`. Allowed for `full` and `branches` tokens.
      responses:
        '200':
          description: The bases.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BaseList'}
              example:
                items:
                  - name: prod
                    description: Masked production data, refreshed every Monday
                    runtime: postgres@18.6
                    status: ready
                    status_reason: null
                    node: node1
                    port: 40100
                    created_at: '2026-11-01T09:00:00Z'
                    latest_snapshot: s20261109
                    snapshots:
                      - {name: s20261109, created_at: '2026-11-09T03:00:00Z', public: false}
                    replicas:
                      s20261109: [node2]
                    replica_nodes: null
                    holders:
                      - {node: node1, state: held, origin: true}
                      - {node: node2, state: held, origin: false}
                    operation: null
                    anonymous: {max_branches: null, max_ttl: null}
                    can: {base.snapshot: true, base.delete: true}
                next_cursor: null
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [bases]
      operationId: createBase
      summary: Create a base
      x-dbb-action: base.create
      x-dbb-token-scopes: [full]
      description: |-
        Creates a base, loads the dump if one is given, and takes its first snapshot. Answers `202` with an operation of kind `base.create`.

        **Action:** `base.create`. Needs a console session of an admin, the local socket, or a `full` token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateBase'}
      responses:
        '202':
          description: Accepted. Poll the operation or follow the event stream.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location: {$ref: '#/components/headers/Location'}
        '400':
          description: 'invalid_request: malformed JSON, an unknown field, or an invalid value.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 'runtime_not_installed: the runtime is not installed on the node. not_found: no such upload.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: already_exists.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: 'not_implemented: `dump` names an upload and uploads are not available on this node.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/public/bases:
    get:
      tags: [bases]
