            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/operations:
    get:
      tags: [operations]
      operationId: listOperations
      summary: List operations
      x-dbb-action: operation.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Lists operations, newest first. The newest 200 finished operations are kept. Admins (a `full` token, the admin password, the local socket) see all of them; everyone else sees only the operations they started and those of people who share their branches (a module's team policy). Operations the system started (installing a runtime, a scheduled refresh) are for admins only. An operation belongs to whoever sent the request: when an admin makes a branch for someone else, the admin owns the operation, not the branch owner.

        **Action:** `operation.read`. Allowed for `full` and `branches` tokens.
      responses:
        '200':
          description: The operations.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationList'}
              example:
                items:
                  - id: op_01JC8Z6Q4M7V3X2N9K5R8T1W0B
                    kind: branch.create
                    target: {resource: branch, name: feature-x}
                    node: node1
                    state: running
                    phase: cloning
                    created_at: '2026-11-09T12:00:00Z'
                    updated_at: '2026-11-09T12:00:03Z'
                    seq: 1762689600000000000
                next_cursor: null
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/operations/{id}:
    get:
      tags: [operations]
      operationId: getOperation
      summary: Get an operation
      x-dbb-action: operation.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Returns one operation. Without a login this works for operations started by an anonymous branch creation. Anyone else gets `404` for an operation they may not see (see List operations), as for an ID that does not exist.

        **Action:** `operation.read`. Allowed for `full` and `branches` tokens.
      security:
        - bearerAuth: []
        - session: []
        - localSocket: []
        - {}
      parameters:
        - {$ref: '#/components/parameters/OperationId'}
      responses:
        '200':
          description: The operation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: Stream changes (Server-Sent Events)
      x-dbb-action: event.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        A Server-Sent Events stream of changes, so that a client does not have to poll. Each event has an `id`, an `event` name and JSON `data`.

        **Who receives what.** Admins receive every event. Everyone else receives only the events they could also read with the matching call: `branch.*` and `operation.updated` for their own branches and operations, those of people who share their branches, and open branches; `base.*`, `runtime.*`, `node.updated`, `module.updated`, `setting.updated` and `update.updated` only if the token or role allows `base.read`, `runtime.read`, `cluster.read`, `module.read`, `setting.read` and `update.read`. The `id`s keep counting across the events a client does not receive, so they may skip numbers.

        | Event | Data |
        |---|---|
        | `branch.updated`, `base.updated` | The same object GET returns (a base without `can`) |
        | `branch.deleted`, `base.deleted` | `{"name": "..."}` |
        | `operation.updated` | The operation |
        | `runtime.updated`, `runtime.deleted` | A runtime, or `{"runtime": "..."}` when deleted |
        | `node.updated` | A node changed; read the cluster |
        | `setting.updated` | The settings scope that changed |
        | `module.updated`, `update.updated` | A change in modules or in a cluster update; fetch the resource again |

        After a dropped connection, reconnect with `Last-Event-ID: <last id>` to receive what you missed. If that is too old to replay, the server sends `event: resync` first and the client should reload the lists. A comment line (`: ping`) arrives every 15 seconds. A client that reads too slowly is disconnected and should reconnect. There is no way to filter by event type.

        **Action:** `event.read`. Allowed for `full` and `branches` tokens.
      parameters:
        - name: Last-Event-ID
          in: header
          description: The last event id received; replay starts after it.
          schema: {type: string}
      responses:
        '200':
          description: The stream.
          content:
            text/event-stream:
              schema: {type: string}
              example: |+
                id: 18343
                event: branch.updated
                data: {"name":"feature-x","status":"ready"}

        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/capabilities:
    get:
      tags: [cluster]
      operationId: getCapabilities
      summary: Get the node's version and modules
      x-dbb-action: capability.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Returns this node's version, the modules it runs, the console pages that modules add, whether branches can be recorded, and what each database engine offers (`engines`).

        **Action:** `capability.read`. Allowed for `full` and `branches` tokens.
      responses:
        '200':
          description: The capabilities.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Capabilities'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/cluster:
    get:
      tags: [cluster]
      operationId: getCluster
      summary: Get the cluster
      x-dbb-action: cluster.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Returns the cluster as this node sees it: nodes with their state, pool, installed runtimes, modules, latest metrics sample, system (OS, kernel, ZFS) and service ids. A single node reports mode `single`.

        **Action:** `cluster.read`. Allowed for `full` and `branches` tokens.
      responses:
        '200':
          description: The cluster.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Cluster'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/nodes/{name}/metrics:
    get:
      tags: [cluster]
      operationId: getNodeMetrics
      summary: Get a node's recent metrics
      x-dbb-action: cluster.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Returns the node's recent performance samples (CPU, load, memory, network, ZFS cache), oldest first. Each node keeps its own; the request is forwarded to it.

        **Action:** `cluster.read`. Allowed for `full` and `branches` tokens.
      parameters:
        - name: name
          in: path
          required: true
          description: The node name.
          schema: {type: string}
      responses:
        '200':
          description: The samples.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NodeMetricsList'}
              example:
                items: []
                next_cursor: null
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 'not_found: no such node.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/nodes/{name}/storage:
    get:
      tags: [cluster]
      operationId: getNodeStorage
      summary: Get what a node's storage holds
      x-dbb-action: cluster.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Returns the node's ZFS pool (size and free space) and every dataset and snapshot under db-branch's root with its space use, as a flat list, so a client can see which bases, snapshots and branches use the space and what destroying one would free. Each node keeps its own; the request is forwarded to it.

        **Action:** `cluster.read`. Allowed for `full` and `branches` tokens.
      parameters:
        - name: name
          in: path
          required: true
          description: The node name.
          schema: {type: string}
      responses:
        '200':
          description: The report.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/StorageReport'}
              example:
                node: n1
                pool: tank
                pool_size: 50000000000
                pool_free: 44000000000
                root: tank/db-branch
                nodes:
                  - {name: tank/db-branch/bases/orders, kind: filesystem, used: 900000, referenced: 800000, used_by_snapshots: 100000, created: '2026-11-12T10:00:00Z'}
                  - {name: 'tank/db-branch/bases/orders@s1', kind: snapshot, used: 100000, referenced: 800000, clones: [tank/db-branch/branches/x], created: '2026-11-12T10:05:00Z'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 'not_found: no such node.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '500':
          description: 'internal: zfs could not be read.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: 'not_implemented: the node does not report its storage.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/cluster/token:
    post:
      tags: [cluster]
      operationId: createClusterToken
      summary: Create a join token
      x-dbb-action: cluster.token
      x-dbb-token-scopes: [full]
      description: |-
        Creates a token for joining a node to the cluster (a new one invalidates the previous). Works only over a node's local socket (`db-branch cluster token`); over HTTPS it answers `403 socket_only`. Joining itself is done by the CLI against the nodes' internal API and is not part of this API.

        **Action:** `cluster.token`. Needs a console session of an admin, the local socket, or a `full` token.
      security:
        - localSocket: []
      responses:
        '200':
          description: The token.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClusterToken'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: socket_only (or forbidden).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'not_clustered: run `db-branch cluster init` first.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/cluster/nodes/{name}:
    delete:
      tags: [cluster]
      operationId: removeClusterNode
      summary: Remove a node from the cluster
      x-dbb-action: cluster.remove
      x-dbb-token-scopes: [full]
      description: |-
        Takes a failed or retired node out of the cluster: out of the Raft configuration and out of the node list. The leader does it (a follower forwards the request). The leader itself cannot be removed (run it on another node), and a voter is not removed when the voters left would not have a healthy majority (`409 conflict`).

        While the node still holds the origin of a base, a copy of a base or a branch, the request is refused with `409 in_use` listing them. With `force=true` the records of those are forgotten (branches on the node, bases whose origin was on it, the node's entries in other bases' copies); the data on the node is not touched. A base whose origin was on the node stays (`409 in_use`) while branches on other nodes derive from it. The removal can be repeated after a failure.

        **Action:** `cluster.remove`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - name: name
          in: path
          required: true
          description: The node name.
          schema: {type: string}
        - name: force
          in: query
          required: false
          description: Forget the records of what the node still holds instead of refusing.
          schema: {type: boolean, default: false}
      responses:
        '200':
          description: The node is removed; what a forced removal forgot.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClusterNodeRemoval'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 'not_found: no such node.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'not_clustered, conflict (the leader itself, or no healthy majority would be left) or in_use (the node still holds bases or branches).'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/metrics:
    get:
      tags: [monitoring]
      operationId: getMetrics
      summary: Get Prometheus metrics
      x-dbb-action: metrics.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Cluster and node state, branches, bases, replication, module problems and this node's API request counts in the Prometheus text format. Alerting is Prometheus's job.

        **Action:** `metrics.read`. Allowed for `full` and `branches` tokens.
      responses:
        '200':
          description: Metrics.
          content:
            text/plain:
              schema: {type: string}
              example: |
                # HELP dbbranch_node_up 1 when the node answers heartbeats.
                # TYPE dbbranch_node_up gauge
                dbbranch_node_up{node="node1"} 1
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /healthz:
    get:
      tags: [monitoring]
      operationId: getHealthz
      summary: Liveness check
      description: Answers `ok` whenever the agent serves. No login. Not under `/v1`.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            text/plain:
              schema: {type: string}
              example: |
                ok
        '500':
          description: 'internal: unexpected error. Treat any answer other than 200 as not alive.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /readyz:
    get:
      tags: [monitoring]
      operationId: getReadyz
      summary: Readiness check
      description: Answers `ready` when the node is set up (`db-branch init`) and the cluster has a leader; `503` otherwise. No login. Not under `/v1`.
      security: []
      responses:
        '200':
          description: Ready.
          content:
            text/plain:
              schema: {type: string}
              example: |
                ready
        '503':
          description: 'Not ready: the node is not initialized, or there is no cluster leader.'
          content:
            text/plain:
              schema: {type: string}
              example: |
                not ready: no cluster leader
  /tls.pem:
    get:
      tags: [monitoring]
      operationId: getTlsCertificate
      summary: Get the node's TLS certificate
      description: The node's self-signed certificate, so that clients (MCP, curl) can trust it. No login. Not under `/v1`.
      security: []
      responses:
        '200':
          description: The certificate.
          content:
            application/x-pem-file:
              schema: {type: string}
        '404':
          description: The node serves no certificate of its own.
          content:
            text/plain:
              schema: {type: string}
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in
      description: Checks the credentials and starts a console session. Sets the `dbb_session` cookie (`HttpOnly`, `Secure`, `SameSite=Strict`) and returns the user, the CSRF token and what the user may do. Scripts should use API tokens instead. The attempt is audited. Repeated failures answer `429 rate_limited`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Login'}
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
          headers:
            Set-Cookie:
              description: The `dbb_session` cookie.
              schema: {type: string}
        '400':
          description: 'invalid_request: malformed JSON, an unknown field, or an invalid value.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: 'invalid_credentials: wrong user name or password.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: 'rate_limited: too many failed attempts. See `Retry-After`.'
          headers:
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/auth/methods:
    get:
      tags: [auth]
      operationId: listLoginMethods
      summary: List extra sign-in methods
      description: Lists the extra sign-in methods that modules provide (for example single sign-on). No login.
      security: []
      responses:
        '200':
          description: The methods.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LoginMethods'}
              example:
                items: []
        '500':
          description: 'internal: unexpected error.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/auth/session:
    get:
      tags: [auth]
      operationId: getSession
      summary: Get the current session
      x-dbb-action: auth.session
      x-dbb-token-scopes: [full]
      description: |-
        Returns the same object as login for the current session. Over the local socket, which has no session, it answers `401`.

        **Action:** `auth.session`. Needs a console session of an admin, the local socket, or a `full` token.
      security:
        - session: []
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401':
          description: 'unauthenticated: no session, or a socket or token caller.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out
      x-dbb-action: auth.logout
      x-dbb-token-scopes: [full]
      description: |-
        Ends the console session and clears the cookie.

        **Action:** `auth.logout`. Needs a console session of an admin, the local socket, or a `full` token.
      security:
        - session: []
      responses:
        '204': {description: Done. No content.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/auth/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: Change the password
      x-dbb-action: auth.password
      x-dbb-token-scopes: [full]
      description: |-
        Changes the signed-in user's password. Other sessions end.

        **Action:** `auth.password`. Needs a console session of an admin, the local socket, or a `full` token.
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ChangePassword'}
      responses:
        '204': {description: Done. No content.}
        '400':
          description: 'weak_password: the new password is too weak. invalid_request.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401':
          description: 'invalid_credentials: the current password is wrong. unauthenticated.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '403':
          description: 'managed_elsewhere: a sign-in provider manages the password.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/auth/reset:
    post:
      tags: [auth]
      operationId: resetAdminPassword
      summary: Reset the admin password
      x-dbb-action: auth.reset
      x-dbb-token-scopes: [full]
      description: |-
        Sets a new random admin password for the whole cluster, ends every session and returns the password once. Works only over a node's local socket (`db-branch admin reset-password`).

        **Action:** `auth.reset`. Needs a console session of an admin, the local socket, or a `full` token.
      security:
        - localSocket: []
      responses:
        '200':
          description: The new password.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PasswordReset'}
              example: {password: <new password>}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: socket_only.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/account/preferences:
    get:
      tags: [account]
      operationId: getPreferences
      summary: Get the caller's preferences
      x-dbb-action: account.preference.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Returns the caller's console preferences.

        **Action:** `account.preference.read`. Allowed for `full` and `branches` tokens.
      responses:
        '200':
          description: The preferences.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Preferences'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [account]
      operationId: putPreferences
      summary: Set the caller's preferences
      x-dbb-action: account.preference.write
      x-dbb-token-scopes: [full]
      description: |-
        Sets the console language. An empty string follows the browser.

        **Action:** `account.preference.write`. Needs a console session of an admin, the local socket, or a `full` token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutPreferences'}
      responses:
        '200':
          description: The preferences.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PutPreferences'}
        '400':
          description: 'invalid_request: an unsupported language.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/account/tokens:
    get:
      tags: [account]
      operationId: listPersonalTokens
      summary: List the caller's personal tokens
      x-dbb-action: account.token.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Lists the caller's own tokens. Personal tokens act as the person who made them and always have scope `branches`.

        **Action:** `account.token.read`. Allowed for `full` and `branches` tokens.
      responses:
        '200':
          description: The tokens.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenList'}
              example:
                items:
                  - id: tok_01JC9A1B2C3D4E5F6G7H8J9K0M
                    name: ci-deploy
                    scope: branches
                    created_at: '2026-11-09T12:00:00Z'
                    expires_at: '2026-12-09T12:00:00Z'
                next_cursor: null
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [account]
      operationId: createPersonalToken
      summary: Create a personal token
      x-dbb-action: account.token.write
      x-dbb-token-scopes: [full]
      description: |-
        Creates a token that acts as the caller, for example for an MCP client. The secret is in the answer only. Needs a console session: a call made with a scoped token answers `403 forbidden`. Personal tokens act as the person who made them and always have scope `branches`.

        **Action:** `account.token.write`. Needs a console session of an admin, the local socket, or a `full` token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePersonalToken'}
      responses:
        '201':
          description: The token, with its secret.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Token'}
              example:
                id: tok_01JC9A1B2C3D4E5F6G7H8J9K0M
                name: ci-deploy
                scope: branches
                created_at: '2026-11-09T12:00:00Z'
                expires_at: '2026-12-09T12:00:00Z'
                token: dbb_<secret>
        '400':
          description: 'invalid_request: malformed JSON, an unknown field, or an invalid value.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/account/tokens/{id}:
    delete:
      tags: [account]
      operationId: revokePersonalToken
      summary: Revoke a personal token
      x-dbb-action: account.token.write
      x-dbb-token-scopes: [full]
      description: |-
        Revokes one of the caller's own tokens.

        **Action:** `account.token.write`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - {$ref: '#/components/parameters/TokenId'}
      responses:
        '204': {description: Done. No content.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/tokens:
    get:
      tags: [tokens]
      operationId: listServiceTokens
      summary: List service tokens
      x-dbb-action: token.read
      x-dbb-token-scopes: [full]
      description: |-
        Lists service tokens (not tied to a person). The secret is never shown again.

        **Action:** `token.read`. Needs a console session of an admin, the local socket, or a `full` token.
      responses:
        '200':
          description: The tokens.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TokenList'}
              example:
                items:
                  - id: tok_01JC9A1B2C3D4E5F6G7H8J9K0M
                    name: ci-deploy
                    scope: branches
                    created_at: '2026-11-09T12:00:00Z'
                    expires_at: '2026-12-09T12:00:00Z'
                next_cursor: null
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [tokens]
      operationId: createServiceToken
      summary: Create a service token
      x-dbb-action: token.write
      x-dbb-token-scopes: [full]
      description: |-
        Creates a token for CI and integrations. The answer contains the secret (`token`); it is shown only once. Scope `branches` (default) may create, use and delete branches and read most other resources; `full` may do everything an admin can.

        **Action:** `token.write`. Needs a console session of an admin, the local socket, or a `full` token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateToken'}
      responses:
        '201':
          description: The token, with its secret.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Token'}
              example:
                id: tok_01JC9A1B2C3D4E5F6G7H8J9K0M
                name: ci-deploy
                scope: branches
                created_at: '2026-11-09T12:00:00Z'
                expires_at: '2026-12-09T12:00:00Z'
                token: dbb_<secret>
        '400':
          description: 'invalid_request: malformed JSON, an unknown field, or an invalid value.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/tokens/{id}:
    delete:
      tags: [tokens]
      operationId: revokeServiceToken
      summary: Revoke a service token
      x-dbb-action: token.write
      x-dbb-token-scopes: [full]
      description: |-
        Revokes a service token.

        **Action:** `token.write`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - {$ref: '#/components/parameters/TokenId'}
      responses:
        '204': {description: Done. No content.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/route-users:
    get:
      tags: [route-users]
      operationId: listRouteUsers
      summary: List proxy route users
      x-dbb-action: route-user.read
      x-dbb-token-scopes: [full]
      description: |-
        Lists the proxy logins that open a default branch. Passwords are never returned. Only on nodes that run the proxy (`db-branch-proxysql`).

        **Action:** `route-user.read`. Needs a console session of an admin, the local socket, or a `full` token.
      responses:
        '200':
          description: The route users.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RouteUserList'}
              example:
                items:
                  - {name: app, default_branch: prod}
                next_cursor: null
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: 'no_proxy: this node has no proxy.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/route-users/{name}:
    put:
      tags: [route-users]
      operationId: putRouteUser
      summary: Create or replace a proxy route user
      x-dbb-action: route-user.write
      x-dbb-token-scopes: [full]
      description: |-
        Creates or replaces a proxy login that opens `default_branch`.

        **Action:** `route-user.write`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - name: name
          in: path
          required: true
          description: The proxy user name.
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutRouteUser'}
      responses:
        '200':
          description: The route user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RouteUser'}
        '400':
          description: 'invalid_request: for example an empty password or an invalid default branch.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: no_proxy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [route-users]
      operationId: deleteRouteUser
      summary: Delete a proxy route user
      x-dbb-action: route-user.delete
      x-dbb-token-scopes: [full]
      description: |-
        Deletes the proxy login.

        **Action:** `route-user.delete`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - name: name
          in: path
          required: true
          description: The proxy user name.
          schema: {type: string}
      responses:
        '204': {description: Done. No content.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: no_proxy.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/settings:
    get:
      tags: [settings]
      operationId: listSettings
      summary: List settings
      x-dbb-action: setting.read
      x-dbb-token-scopes: [full]
      description: |-
        Lists every scope with its settings, current values and defaults. Secret settings (the licence key, the open-branch password, webhook secrets) are write-only: their `value` is always empty and `secret_set` says whether one is stored.

        **Action:** `setting.read`. Needs a console session of an admin, the local socket, or a `full` token.
      responses:
        '200':
          description: The scopes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettingScopeList'}
              example:
                items:
                  - scope: core
                    title: db-branch
                    settings:
                      - key: branch.default_ttl
                        label: Default TTL
                        help: 'Expiry for branches created without one, e.g. 72h. Empty: no expiry.'
                        type: duration
                        default: ''
                        value: 72h
                next_cursor: null
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: not_initialized.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/settings/{scope}:
    put:
      tags: [settings]
      operationId: putSettings
      summary: Change settings of a scope
      x-dbb-action: setting.write
      x-dbb-token-scopes: [full]
      description: |-
        Changes values in a scope and returns the scope. Send only the keys to change. A secret setting sent empty (or left out) keeps its value; to remove one, list its key in `clear`.

        **Action:** `setting.write`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - {$ref: '#/components/parameters/ScopePath'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutSettings'}
      responses:
        '200':
          description: The scope.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SettingScope'}
        '400':
          description: 'invalid_request: an unknown key or a value of the wrong type.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: not_initialized.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/modules:
    get:
      tags: [modules]
      operationId: listModules
      summary: List modules
      x-dbb-action: module.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Lists the modules the cluster wants, how far each node has come, and what the package repositories offer. A node whose module reports a problem has a `problem` string.

        **Action:** `module.read`. Allowed for `full` and `branches` tokens.
      responses:
        '200':
          description: The modules.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModuleList'}
              example:
                items:
                  - name: history
                    version: 0.2.0
                    wanted: true
                    requires_license: true
                    nodes:
                      - {node: node1, loaded: 0.2.0, current: true}
                available: {history: Records branch changes}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: not_initialized.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      tags: [modules]
      operationId: installModule
      summary: Turn a module on
      x-dbb-action: module.install
      x-dbb-token-scopes: [full]
      description: |-
        Turns a module on for every node; the nodes install its package. An empty version takes the latest. The APIs and pages a module adds are served under `/v1/ext/<module>/` and documented by the module.

        **Action:** `module.install`. Needs a console session of an admin, the local socket, or a `full` token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/InstallModule'}
      responses:
        '200':
          description: The module.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ModuleSpec'}
        '400':
          description: 'invalid_request: an invalid module name.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: not_initialized.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/modules/{name}:
    delete:
      tags: [modules]
      operationId: removeModule
      summary: Turn a module off
      x-dbb-action: module.remove
      x-dbb-token-scopes: [full]
      description: |-
        Turns a module off for every node.

        **Action:** `module.remove`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - name: name
          in: path
          required: true
          description: The module name.
          schema: {type: string}
      responses:
        '204': {description: Done. No content.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: not_initialized.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/modules/{name}/forget:
    post:
      tags: [modules]
      operationId: forgetModule
      summary: Forget a removed module
      x-dbb-action: module.forget
      x-dbb-token-scopes: [full]
      description: |-
        Deletes the cluster's record of a module that has already been removed, so it is no longer listed. Refuses if the module is still enabled, if the package is still installed on this node, or if any cluster node has not yet reached protocol 22.

        **Action:** `module.forget`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - name: name
          in: path
          required: true
          description: The module name.
          schema: {type: string}
      responses:
        '204': {description: Done. No content.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '409':
          description: 'conflict: the module is still enabled or its package is still installed on this node.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: not_initialized or cluster_upgrading.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/license:
    get:
      tags: [license]
      operationId: getLicense
      summary: Get the licence state
      x-dbb-action: license.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Returns whether a key is saved and, if so, its report (customer, modules, expiry, state, modules it enabled) and the renewal status. During the trial (30 days without a key) the report has `trial: true`. The key itself is never returned.

        **Action:** `license.read`. Allowed for `full` and `branches` tokens.
      responses:
        '200':
          description: The state.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LicenseStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '501':
          description: 'not_implemented: licences are not available on this node.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [license]
      operationId: applyLicense
      summary: Save a licence key
      x-dbb-action: license.write
      x-dbb-token-scopes: [full]
      description: |-
        Saves a usable key and turns on the modules it covers.

        **Action:** `license.write`. Needs a console session of an admin, the local socket, or a `full` token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LicenseKey'}
      responses:
        '200':
          description: What the key covers and what it enabled.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LicenseReport'}
        '400':
          description: 'invalid_request: the key is empty.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: invalid_license or license_unusable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: cannot_verify. not_implemented.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/license/verify:
    post:
      tags: [license]
      operationId: verifyLicense
      summary: Check a licence key
      x-dbb-action: license.verify
      x-dbb-token-scopes: [full]
      description: |-
        Checks a key and says what it covers, without saving it.

        **Action:** `license.verify`. Needs a console session of an admin, the local socket, or a `full` token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LicenseKey'}
      responses:
        '200':
          description: What the key covers.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LicenseReport'}
        '400':
          description: 'invalid_request: the key is empty.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422':
          description: invalid_license or license_unusable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: 'cannot_verify: this build cannot check keys. not_implemented.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/license/renewal:
    get:
      tags: [license]
      operationId: getLicenseRenewal
      summary: Get the licence renewal status
      x-dbb-action: license.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        The online renewal status of the saved key, from the cluster leader (the request is forwarded to it).

        **Action:** `license.read`. Allowed for `full` and `branches` tokens.
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RenewalStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '501':
          description: not_implemented.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/license/renew:
    post:
      tags: [license]
      operationId: renewLicense
      summary: Renew the licence now
      x-dbb-action: license.write
      x-dbb-token-scopes: [full]
      description: |-
        Asks the licence service for the renewed key now ("Check now"), through the cluster leader.

        **Action:** `license.write`. Needs a console session of an admin, the local socket, or a `full` token.
      responses:
        '200':
          description: The status after the attempt.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RenewalStatus'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: 'auto_renew_off: `license.auto_renew` is off. not_renewable: the key has no subscription. in_progress: an attempt is running.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: invalid_license or license_unusable.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '429':
          description: 'rate_limited: asked too soon. See `Retry-After`.'
          headers:
            Retry-After: {$ref: '#/components/headers/RetryAfter'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: not_implemented.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/updates:
    get:
      tags: [updates]
      operationId: getUpdates
      summary: Get update status
      x-dbb-action: update.read
      x-dbb-token-scopes: [full, branches]
      description: |-
        Nodes with their versions, packages with the newer versions on offer, `latest_minor`, and the current rollout. Updates move every node to a newer minor or patch version, followers first and the leader last.

        **Action:** `update.read`. Allowed for `full` and `branches` tokens.
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpdateView'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: 'not_initialized: updates are not available on this node.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    post:
      tags: [updates]
      operationId: applyUpdate
      summary: Start a cluster update
      x-dbb-action: update.apply
      x-dbb-token-scopes: [full]
      description: |-
        Starts a rollout to `target`. Answers `202` with the rollout. It stops at the first failed node and does not roll back. Major versions are updated by hand.

        **Action:** `update.apply`. Needs a console session of an admin, the local socket, or a `full` token.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApplyUpdate'}
      responses:
        '202':
          description: The rollout.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Rollout'}
        '400':
          description: 'invalid_request: `target` is missing or invalid.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: 'rollout_running: another rollout is in progress.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: not_initialized.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
    delete:
      tags: [updates]
      operationId: cancelUpdate
      summary: Stop the running update
      x-dbb-action: update.apply
      x-dbb-token-scopes: [full]
      description: |-
        Stops the running rollout.

        **Action:** `update.apply`. Needs a console session of an admin, the local socket, or a `full` token.
      responses:
        '204': {description: Done. No content.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409':
          description: 'conflict: no rollout is running.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503':
          description: not_initialized.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/updates/check:
    post:
      tags: [updates]
      operationId: checkUpdates
      summary: Check for updates
      x-dbb-action: update.check
      x-dbb-token-scopes: [full]
      description: |-
        Asks the package repository for newer versions and returns the same view as getUpdates.

        **Action:** `update.check`. Needs a console session of an admin, the local socket, or a `full` token.
      responses:
        '200':
          description: The status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpdateView'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503':
          description: not_initialized.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/backups:
    get:
      tags: [backups]
      operationId: listBackups
      summary: List backups
      x-dbb-action: backup.read
      x-dbb-token-scopes: [full]
      description: |-
        Lists the cluster-state backups on this node (or `?node=`). A backup holds settings, tokens, modules, route users, runtimes and the admin password, not the data of bases. The files contain secrets.

        **Action:** `backup.read`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - {$ref: '#/components/parameters/NodeQuery'}
      responses:
        '200':
          description: The backups.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupList'}
              example:
                node: node1
                items:
                  - {name: db-branch-node1-20261109T120000Z.json.gz, size: 20480, taken_at: '2026-11-09T12:00:00Z'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '501':
          description: 'not_implemented: backups are not available on this node.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
    post:
      tags: [backups]
      operationId: createBackup
      summary: Take a backup now
      x-dbb-action: backup.create
      x-dbb-token-scopes: [full]
      description: |-
        Takes a backup on this node (or `?node=`) now.

        **Action:** `backup.create`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - {$ref: '#/components/parameters/NodeQuery'}
      responses:
        '201':
          description: The new backup file.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BackupFile'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '501':
          description: not_implemented.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/backups/{file}:
    get:
      tags: [backups]
      operationId: downloadBackup
      summary: Download a backup
      x-dbb-action: backup.download
      x-dbb-token-scopes: [full]
      description: |-
        Downloads a backup file. It holds secrets, so only admins can; every download is audited. The request goes to the node named in the file name unless `?node=` says otherwise.

        **Action:** `backup.download`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - name: file
          in: path
          required: true
          description: The backup file name.
          schema: {type: string}
        - {$ref: '#/components/parameters/NodeQuery'}
      responses:
        '200':
          description: The gzip-compressed backup.
          content:
            application/gzip:
              schema: {type: string, format: binary}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: not_implemented.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/backups/restore:
    post:
      tags: [backups]
      operationId: restoreBackup
      summary: Restore a backup
      x-dbb-action: backup.restore
      x-dbb-token-scopes: [full]
      description: |-
        Applies a backup (the request body is the file) to the cluster, replacing the admin password and tokens. Works only over a node's local socket (`db-branch backup restore <file>`).

        **Action:** `backup.restore`. Needs a console session of an admin, the local socket, or a `full` token.
      security:
        - localSocket: []
      requestBody:
        required: true
        content:
          application/gzip:
            schema: {type: string, format: binary}
      responses:
        '200':
          description: What was restored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RestoreSummary'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: socket_only.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '422':
          description: 'restore_failed: the backup could not be applied.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: not_implemented.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/mcp:
    post:
      tags: [mcp]
      operationId: callMcp
      summary: Model Context Protocol endpoint
      x-dbb-action: mcp.use
      x-dbb-token-scopes: [full, branches]
      description: |-
        The MCP endpoint (Streamable HTTP, stateless, JSON responses) for LLM agents. It takes the same bearer tokens and runs every tool through the same routes, so authorization and audit are those of the REST calls below. The caller needs the action `mcp.use`. Only POST is supported.

        Tools: `list_bases`, `list_branches`, `create_branch`, `get_branch`, `reset_branch`, `delete_branch`, `extend_branch`, `create_checkpoint`, `list_checkpoints`, `restore_checkpoint`, `check_upgrade`, `upgrade_branch`, `query`.

        **Action:** `mcp.use`. Allowed for `full` and `branches` tokens.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/McpRequest'}
      responses:
        '200':
          description: A JSON-RPC response.
          content:
            application/json:
              schema: {type: object}
        '400':
          description: A malformed JSON-RPC message.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403':
          description: 'forbidden: the caller may not use MCP.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: dbb_...
      description: 'An API token (service or personal). Sent as `Authorization: Bearer dbb_...`. Needs no CSRF token.'
    session:
      type: apiKey
      in: cookie
      name: dbb_session
      description: The console session from `POST /v1/auth/login`. Every request other than GET must also carry the `X-CSRF-Token` header (`csrf_token` of the login answer), or it fails with `403 csrf_failed`.
    localSocket:
      type: http
      scheme: peercred
      description: The UNIX socket `/run/db-branch/agent.sock` (server URL `http://unix/`). The caller is identified by its process credentials and must be root or in the `db-branch` group; it acts as an admin. No session, cookie or CSRF token.
  parameters:
    BranchName:
      name: name
      in: path
      required: true
      description: The branch name.
      schema: {$ref: '#/components/schemas/Name'}
    BaseName:
      name: name
      in: path
      required: true
      description: The base name.
      schema: {$ref: '#/components/schemas/Name'}
    CheckpointName:
      name: checkpoint
      in: path
      required: true
      description: The checkpoint name.
      schema: {type: string, maxLength: 40, pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$'}
    SnapshotName:
      name: snapshot
      in: path
      required: true
      description: The snapshot name.
      schema: {type: string}
    OperationId:
      name: id
      in: path
      required: true
      description: The operation ID.
      schema: {type: string}
    TokenId:
      name: id
      in: path
      required: true
      description: The token ID.
      schema: {type: string}
    EnginePath:
      name: engine
      in: path
      required: true
      description: The engine.
      schema: {$ref: '#/components/schemas/Engine'}
    VersionPath:
      name: version
      in: path
      required: true
      description: The version, for example `18.6`.
      schema: {type: string}
    ScopePath:
      name: scope
      in: path
      required: true
      description: 'The settings scope: `core` or a module''s name.'
      schema: {type: string}
    NodeQuery:
      name: node
      in: query
      required: false
      description: Run the call on this node instead of the one asked (in a cluster).
      schema: {type: string}
  headers:
    Location:
      description: The URL of the operation, `/v1/operations/{id}`.
      schema: {type: string}
    RetryAfter:
      description: Seconds to wait before trying again.
      schema: {type: integer}
  responses:
    Unauthenticated:
      description: 'unauthenticated: no session or token, or it is invalid or expired. invalid_credentials.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: 'forbidden: the action is not allowed for this caller or token scope, or the branch belongs to someone else. csrf_failed: a cookie session without a matching `X-CSRF-Token`.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: 'not_initialized: the node has not run `db-branch init` or the feature is not set up. no_leader: the cluster has no leader (see `Retry-After`). modules_pending: this node does not run every required module yet.'
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Name:
      type: string
      maxLength: 32
      pattern: ^[a-z](?:[a-z0-9]|-[a-z0-9])*$
      description: 'Name of a branch, base or snapshot: lowercase letters, digits and single hyphens, starting with a letter, at most 32 characters. Names are unique across the cluster and cannot be changed.'
      examples: [feature-x]
    RuntimeRef:
      type: string
      pattern: ^(mysql|postgres)@[0-9]+\.[0-9]+(\.[0-9]+)?(-[a-z0-9]+(\.[a-z0-9]+)*)?$
      description: A database engine version, written `engine@version`.
      examples: [mysql@8.4.13, postgres@18.6]
    Engine:
      type: string
      enum: [mysql, postgres]
    Duration:
      type: string
      description: A Go duration such as `72h`, `30m` or `1h30m`.
      examples: [72h]
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable, machine-readable code. Branch on this. See the table of codes in the API overview.
              examples: [not_found]
            message:
              type: string
              description: Human-readable text in English. It may change; do not parse it.
              examples: ['branch feature-x: not found']
          required: [code, message]
      required: [error]
      example:
        error: {code: not_found, message: 'branch feature-x: not found'}
    OperationRef:
      type: object
      description: The operation running on a resource right now.
      properties:
        id:
          type: string
          examples: [op_01JC8Z6Q4M7V3X2N9K5R8T1W0B]
        kind:
          type: string
          examples: [branch.reset]
      required: [id, kind]
    Operation:
      type: object
      description: The progress record of one long-running task.
      properties:
        id:
          type: string
          description: Operation ID (`op_` followed by a ULID).
          examples: [op_01JC8Z6Q4M7V3X2N9K5R8T1W0B]
        kind:
          type: string
          enum:
            - branch.create
            - branch.reset
            - branch.pause
            - branch.resume
            - branch.recreate
            - branch.delete
            - branch.restore
            - branch.upgrade
            - base.create
            - base.snapshot
            - base.mask
            - base.load
            - base.refresh
            - runtime.install
        target:
          type: object
          properties:
            resource:
              type: string
              enum: [branch, base, runtime]
            name: {type: string}
          required: [resource, name]
        node: {type: string, description: The node running the task.}
        owner: {type: string, description: 'The ID of the principal that started the task (the same ID as a branch''s `owner`). Absent for tasks the system started, which only admins may read.'}
        state:
          type: string
          enum: [running, succeeded, failed]
        phase:
          type: string
          description: Where a running task is, for example `cloning`, `starting`, `init_sql`, `snapshotting`, `checkpointing`, `upgrading`. The set of phases can grow; treat unknown values as progress text.
        error: {type: string, description: Why the task failed (when `state` is `failed`).}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, description: Set once the task has ended.}
        seq: {type: integer, format: int64, description: 'Orders operations by start, newest highest, across nodes.'}
        result:
          $ref: '#/components/schemas/UpgradeResult'
          description: 'What the task reports besides success or failure, set when it finishes. Today only a branch upgrade (`branch.upgrade`, and `branch.create` with `runtime`) has one: an UpgradeResult. Absent for other kinds.'
      required: [id, kind, target, state, created_at, updated_at, seq]
      example:
        id: op_01JC8Z6Q4M7V3X2N9K5R8T1W0B
        kind: branch.create
        target: {resource: branch, name: feature-x}
        node: node1
        state: running
        phase: cloning
        created_at: '2026-11-09T12:00:00Z'
        updated_at: '2026-11-09T12:00:03Z'
        seq: 1762689600000000000
    OperationList:
      type: object
      description: Operations, newest first. The newest 200 finished operations are kept.
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Operation'}
        next_cursor: {type: 'null', description: 'Always null: lists are not paginated.'}
      required: [items, next_cursor]
    Connection:
      type: object
      properties:
        host: {type: string}
        port: {type: integer}
        user: {type: string}
      required: [host, port, user]
    Branch:
      type: object
      properties:
        name: {$ref: '#/components/schemas/Name'}
        id:
          type: string
          description: '`owner_name/name` when the branch has an owner (an email is shortened to its local part), otherwise the name.'
          examples: [alice/feature-x]
        owner:
          type: [string, 'null']
          description: Immutable principal ID of who manages the branch (null for legacy branches without an owner, which are admin-only).
          examples: [oidc:alice@example.com]
        owner_name:
          type: [string, 'null']
          description: Display name of the branch owner (e.g. email address or token name; falls back to `owner`).
          examples: [alice@example.com]
        access:
          type: string
          enum: [private, open]
          description: '`private`: the branch has its own password; owner and admins connect. `open`: it uses the cluster''s shared password and anyone may connect and query.'
        status:
          type: string
          enum: [provisioning, ready, resetting, restoring, upgrading, pausing, paused, resuming, deleting, failed, lost]
          description: '`lost` means the node holding the branch is gone (see recreate). `restoring` and `upgrading` are shown while a checkpoint restore or a runtime upgrade runs. `paused` means the database server is stopped and the data kept (see pause); `pausing` and `resuming` are shown while it is stopped or started.'
        status_reason:
          type: [string, 'null']
          description: 'Why a branch is `failed` or `lost`. After an upgrade kept with `no_rollback` it starts with `upgrade failed: `.'
        base: {$ref: '#/components/schemas/Name'}
        snapshot: {type: string, description: The snapshot of the base the branch was cloned from.}
        runtime:
          $ref: '#/components/schemas/RuntimeRef'
          description: The runtime the branch runs now. It differs from `base_runtime` after an upgrade.
        base_runtime: {$ref: '#/components/schemas/RuntimeRef', description: The runtime of the base.}
        node: {type: string, description: The node holding the branch.}
        created_at: {type: string, format: date-time}
        expires_at:
          type: [string, 'null']
          format: date-time
          description: When the branch is deleted automatically; null for no expiry.
        reset_at:
          type: [string, 'null']
          format: date-time
          description: When the branch was last reset; null if never.
        storage:
          oneOf:
            - type: object
              properties:
                used: {type: integer, format: int64, description: Bytes written by the branch.}
                referenced: {type: integer, format: int64, description: Bytes the branch can read.}
              required: [used, referenced]
            - {type: 'null'}
          description: Space use in bytes, or null if unknown.
        connection:
          $ref: '#/components/schemas/Connection'
          description: 'Direct connection: the node''s host, the branch''s own port and its user. The database name and password are in the DSN.'
        proxy:
          oneOf:
            - {$ref: '#/components/schemas/Connection'}
            - {type: 'null'}
          description: Connection through the node's proxy by user name; null when the node has no proxy or the branch has no user of its own.
        operation:
          oneOf:
            - {$ref: '#/components/schemas/OperationRef'}
            - {type: 'null'}
        record:
          type: boolean
          description: The branch records its changes (needs the paid `history` module). Fixed when the branch is created, by `record` or the module's `history.record_all` setting; nothing changes it afterwards.
        checkpoints:
          type: boolean
          description: Whether the node holding the branch can take checkpoints (it needs its own ZFS pool). When false, the checkpoint endpoints answer `409 checkpoints_unavailable`.
      required:
        - name
        - id
        - owner
        - owner_name
        - access
        - status
        - status_reason
        - base
        - snapshot
        - runtime
        - base_runtime
        - node
        - created_at
        - expires_at
        - reset_at
        - storage
        - connection
        - proxy
        - operation
        - record
        - checkpoints
      example:
        name: feature-x
        id: alice/feature-x
        owner: oidc:alice@example.com
        owner_name: alice@example.com
        access: private
        status: ready
        status_reason: null
        base: prod
        snapshot: s20261109
        runtime: postgres@18.6
        base_runtime: postgres@18.6
        node: node1
        created_at: '2026-11-09T12:00:00Z'
        expires_at: '2026-11-12T12:00:00Z'
        reset_at: null
        storage: {used: 1048576, referenced: 83886080}
        connection: {host: node1, port: 41203, user: feature-x}
        proxy: {host: node1, port: 6133, user: feature-x}
        operation: null
        record: false
        checkpoints: true
    BranchList:
      type: object
      description: All branches, sorted by name.
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Branch'}
        next_cursor: {type: 'null', description: 'Always null: lists are not paginated.'}
      required: [items, next_cursor]
    CreateBranch:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/Name'
          description: 'Branch name, unique across the cluster. Used exactly as given, except when a non-admin creates a branch from a console login session: then the owner''s prefix is put in front (`test` becomes `alice-test`). The whole name, prefix included, must fit in 32 characters.'
        base: {$ref: '#/components/schemas/Name', description: The base to clone.}
        snapshot:
          type: [string, 'null']
          description: 'The base snapshot to clone. Default: the base''s latest. Callers without a login can use only public snapshots.'
        init_sql:
          type: string
          description: SQL to run once after cloning. A reset returns the branch to its state after this ran.
        ttl:
          $ref: '#/components/schemas/Duration'
          description: 'Lifetime from now. Default: the `branch.default_ttl` setting, or no expiry. Anonymous branches are capped at the anonymous TTL limits.'
        node:
          type: string
          description: 'Node to place the branch on. Default: chosen by load, among nodes that hold the snapshot.'
        owner:
          type: string
          description: 'Immutable principal ID of who manages the branch. Default: the caller. Only an admin (or a `full` token) may name someone else.'
        owner_name:
          type: string
          description: 'Display name of the owner when an admin creates a branch for another owner. Ignored for non-admins.'
        access:
          type: string
          enum: [private, open]
          default: private
          description: Anonymous callers always get `open`.
        record:
          type: boolean
          description: Record the branch's changes from its creation (needs the paid `history` module, a login and a MySQL base).
        runtime:
          $ref: '#/components/schemas/RuntimeRef'
          description: Upgrade the new branch to this runtime right away (same rules and operation `result` as the upgrade endpoint). Needs a login. If the upgrade fails the branch stays, on the base's runtime.
      required: [name, base]
      additionalProperties: false
      example:
        name: feature-x
        base: prod
        ttl: 72h
        init_sql: CREATE INDEX idx_orders_created ON orders (created_at);
    ExtendBranch:
      type: object
      properties:
        ttl:
          $ref: '#/components/schemas/Duration'
          description: The branch now expires this long from now.
      required: [ttl]
      additionalProperties: false
      example: {ttl: 24h}
    Dsn:
      type: object
      properties:
        dsn:
          type: string
          description: Connection URL including the password.
          examples: ['postgres://feature-x:<password>@node1:41203/postgres']
      required: [dsn]
    QueryRequest:
      type: object
      properties:
        sql: {type: string, description: One SQL statement.}
        max_rows:
          type: integer
          default: 1000
          maximum: 1000
          description: Rows to return, at most 1000.
      required: [sql]
      additionalProperties: false
      example: {sql: 'SELECT id, email FROM users ORDER BY id', max_rows: 100}
    QueryResult:
      type: object
      properties:
        columns:
          type: array
          items: {type: string}
        rows:
          type: array
          items:
            type: array
            items:
              type: [string, 'null']
          description: Values as text; SQL NULL is null.
        truncated: {type: boolean, description: More rows existed than `max_rows`.}
        affected:
          type: integer
          format: int64
          description: Rows changed, for statements that return no rows (replaces columns and rows).
        millis: {type: integer, format: int64, description: Run time in milliseconds.}
      required: [millis]
      example:
        columns: [id, email]
        rows:
          - ['1', user1@example.invalid]
          - ['2', null]
        truncated: false
        millis: 4
    Checkpoint:
      type: object
      properties:
        name:
          type: string
          maxLength: 40
          pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$
          examples: [before-migration]
        created_at: {type: string, format: date-time}
        size: {type: integer, format: int64, description: Bytes only this checkpoint holds.}
        line:
          type: integer
          description: 'The line of history it was taken on (0: the branch''s first). Every restore starts a new line.'
        auto:
          type: boolean
          description: Taken by the system before an upgrade (`before-upgrade-<time>`), or before a restore by older versions (`before-restore-<time>`).
        current: {type: boolean, description: The branch's data descends from this checkpoint.}
        runtime:
          $ref: '#/components/schemas/RuntimeRef'
          description: What the branch ran when the checkpoint was taken; restoring switches back to it.
        warning:
          type: string
          description: 'Only on a freshly created checkpoint: the branch (data and history) uses more than half of the pool''s free space. The checkpoint is saved anyway.'
      required: [name, created_at, size, line, auto, current]
      example:
        name: before-migration
        created_at: '2026-11-12T15:30:00Z'
        size: 98304
        line: 0
        auto: false
        current: true
        runtime: mysql@8.0.40
    CheckpointLine:
      type: object
      properties:
        line: {type: integer}
        live: {type: boolean, description: The branch runs on this line.}
        parent:
          type: [integer, 'null']
          description: The line of the checkpoint this line was restored from; null for the first line.
        from:
          type: string
          description: 'That checkpoint (`reset`: the branch''s creation state; empty: none).'
      required: [line, live, parent, from]
    CheckpointList:
      type: object
      description: Checkpoints of all lines, oldest first, and the structure of the lines so a client can draw the history.
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Checkpoint'}
        next_cursor: {type: 'null', description: 'Always null: lists are not paginated.'}
        lines:
          type: array
          items: {$ref: '#/components/schemas/CheckpointLine'}
        live: {type: integer, description: The number of the line the branch runs on.}
        head:
          type: [string, 'null']
          description: The checkpoint the branch's data descends from; null when none.
      required: [items, next_cursor]
    CreateCheckpoint:
      type: object
      properties:
        name: {type: string, description: 'Optional. Default: the UTC time (`20261112-153000`).'}
      additionalProperties: false
      example: {name: before-migration}
    Finding:
      type: object
      properties:
        level:
          type: string
          enum: [error, warning, info]
        code:
          type: string
          examples: [native_password_users]
          description: One of `upgrade_path`, `runtime_not_installed`, `disk_space`, `native_password_users`, `native_password_removed`, `branch_user_converted`, `config_invalid`, `config_adapted`, `log_warning`, `log_error`, `log_upgrade`.
        message: {type: string}
      required: [level, code, message]
    UpgradeRequest:
      type: object
      properties:
        runtime:
          $ref: '#/components/schemas/RuntimeRef'
          description: The target runtime. It must be installed on the branch's node.
        check_only: {type: boolean, description: Run the pre-check only; change nothing.}
        no_rollback:
          type: boolean
          description: Keep a failed upgrade as it is instead of restoring the checkpoint.
        force: {type: boolean, description: Upgrade although the pre-check found errors.}
      required: [runtime]
      additionalProperties: false
      example:
        runtime: mysql@8.4.13
        check_only: false
        no_rollback: false
        force: false
    UpgradeResult:
      type: object
      description: The `result` of a finished `branch.upgrade` operation. It is also present when the operation failed.
      properties:
        branch: {type: string}
        from: {$ref: '#/components/schemas/RuntimeRef'}
        to: {$ref: '#/components/schemas/RuntimeRef'}
        status:
          type: string
          enum: [checked, upgraded, rolled_back, failed, refused, aborted]
          description: '`checked`: check only, nothing changed. `upgraded`: the branch runs the new runtime. `rolled_back`: failed, the branch is back on the old runtime. `failed`: failed and kept (no_rollback). `refused`: the pre-check found errors, nothing changed. `aborted`: failed before anything changed.'
        check_only: {type: boolean}
        checkpoint:
          type: string
          description: The automatic `before-upgrade-<time>` checkpoint, when one was taken.
        pre_check:
          type: array
          items: {$ref: '#/components/schemas/Finding'}
        log:
          type: array
          items: {$ref: '#/components/schemas/Finding'}
          description: Warnings and errors the server logged while it started on the new runtime.
        error: {type: string}
        log_excerpt: {type: string, description: 'End of the server''s error log, kept when the start failed.'}
      required: [branch, from, to, status, check_only, pre_check, log]
      example:
        branch: feature-x
        from: mysql@8.0.40
        to: mysql@8.4.13
        status: upgraded
        check_only: false
        checkpoint: before-upgrade-20261112-153000
        pre_check:
          - level: warning
            code: native_password_users
            message: 2 accounts use mysql_native_password; the plugin stays loaded for this branch
        log: []
    MaskInfo:
      type: object
      description: How a snapshot was masked from another base.
      properties:
        source: {$ref: '#/components/schemas/Name'}
        source_snapshot: {type: string}
        masker: {type: string}
        rules_sha256: {type: string}
        by: {type: string}
      required: [source, source_snapshot, masker, rules_sha256]
    Snapshot:
      type: object
      properties:
        name: {type: string}
        created_at: {type: string, format: date-time}
        public: {type: boolean, description: Anyone may create a branch from it without logging in.}
        mask: {$ref: '#/components/schemas/MaskInfo'}
      required: [name, created_at, public]
    Holder:
      type: object
      properties:
        node: {type: string}
        state:
          type: string
          enum: [held, pulling, draining, skipped]
          description: '`held`: the node holds the base. `pulling`: it is copying it. `draining`: it holds a copy it is giving up. `skipped`: it is left out because of its operating system (PostgreSQL data depends on the system''s collation libraries).'
        origin: {type: boolean, description: The node the base lives on.}
        reason:
          type: string
          description: 'Why a `skipped` node gets no copy, for example `other OS: ubuntu-26.04`.'
        distro: {type: string, description: That node's distribution.}
      required: [node, state, origin]
    AnonymousLimits:
      type: object
      description: What callers without a login may do with the base, on top of the cluster-wide settings.
      properties:
        max_branches:
          type: [integer, 'null']
          description: Most branches that may exist from this base without a login. null inherits the cluster-wide cap, 0 allows none.
        max_ttl:
          type: [string, 'null']
          description: Longest TTL of such branches (a duration such as `4h`). null inherits the cluster-wide TTL.
      required: [max_branches, max_ttl]
    Base:
      type: object
      properties:
        name: {$ref: '#/components/schemas/Name'}
        description: {type: string, description: Free text about what the base holds.}
        runtime: {$ref: '#/components/schemas/RuntimeRef'}
        status:
          type: string
          enum: [provisioning, ready, maintenance, failed]
        status_reason:
          type: [string, 'null']
        node: {type: string, description: The node the base lives on.}
        port: {type: integer}
        created_at: {type: string, format: date-time}
        latest_snapshot:
          type: [string, 'null']
        snapshots:
          type: array
          items: {$ref: '#/components/schemas/Snapshot'}
        replicas:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
          description: For each snapshot, the other nodes that hold a copy.
        replica_nodes:
          type: [array, 'null']
          items: {type: string}
          description: 'The setting: null keeps a copy on every node, a list names the other nodes that keep one (the base''s own node is implied).'
        holders:
          type: array
          items: {$ref: '#/components/schemas/Holder'}
        operation:
          oneOf:
            - {$ref: '#/components/schemas/OperationRef'}
            - {type: 'null'}
        anonymous: {$ref: '#/components/schemas/AnonymousLimits'}
        can:
          type: object
          additionalProperties: {type: boolean}
          description: Which base actions the caller may do on this base (`base.snapshot`, `base.delete`, ...). Used by the console to show buttons. Absent in events.
      required:
        - name
        - description
        - runtime
        - status
        - status_reason
        - node
        - port
        - created_at
        - latest_snapshot
        - snapshots
        - replicas
        - replica_nodes
        - holders
        - operation
        - anonymous
      example:
        name: prod
        description: Masked production data, refreshed every Monday
        runtime: postgres@18.6
        status: ready
        status_reason: null
        node: node1
        port: 40100
        created_at: '2026-11-01T09:00:00Z'
        latest_snapshot: s20261109
        snapshots:
          - {name: s20261109, created_at: '2026-11-09T03:00:00Z', public: false}
        replicas:
          s20261109: [node2]
        replica_nodes: null
        holders:
          - {node: node1, state: held, origin: true}
          - {node: node2, state: held, origin: false}
        operation: null
        anonymous: {max_branches: null, max_ttl: null}
        can: {base.snapshot: true, base.delete: true}
    BaseList:
      type: object
      description: All bases, sorted by name.
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Base'}
        next_cursor: {type: 'null', description: 'Always null: lists are not paginated.'}
      required: [items, next_cursor]
    CreateBase:
      type: object
      properties:
        name: {$ref: '#/components/schemas/Name'}
        runtime: {$ref: '#/components/schemas/RuntimeRef', description: Must be installed on the node.}
        dump:
          type: string
          description: 'A `.sql` or `.sql.gz` dump to load: an upload ID (`upload:...`) or a path on the node. Omit for an empty base.'
        description: {type: string, maxLength: 1000}
        node:
          type: string
          description: 'Node to create the base on (a `dump` path is read there). Default: the node called.'
        replica_nodes:
          type: [array, 'null']
          items: {type: string}
          description: 'null or absent: every node keeps a copy. `[]`: only the base''s node. A list: those nodes as well.'
      required: [name, runtime]
      additionalProperties: false
      example:
        name: prod
        runtime: postgres@18.6
        dump: upload:01JC8Z7R2K5M9T4V6X1B3N8Q0D
        description: Masked production data
    PatchBase:
      type: object
      properties:
        description: {type: string}
      required: [description]
      additionalProperties: false
      example: {description: Masked production data}
    PutReplicas:
      type: object
      properties:
        replica_nodes:
          type: [array, 'null']
          items: {type: string}
          description: 'null: every node. `[]`: the base''s node only. A list: those nodes besides it.'
      required: [replica_nodes]
      additionalProperties: false
      example:
        replica_nodes: [node2]
    PatchAnonymous:
      type: object
      description: Keys left out stay as they are. This does not make a snapshot public (see patchSnapshot).
      properties:
        max_branches:
          type: [integer, 'null']
          description: A whole number (0 for none), or null to inherit the cluster-wide cap.
        max_ttl:
          type: [string, 'null']
          description: A positive duration such as `4h`, or null to inherit.
      additionalProperties: false
      minProperties: 1
      example: {max_branches: 3, max_ttl: 4h}
    PatchSnapshot:
      type: object
      properties:
        public: {type: boolean}
      required: [public]
      additionalProperties: false
      example: {public: true}
    MaskBase:
      type: object
      properties:
        source: {$ref: '#/components/schemas/Name', description: The base to copy from.}
        snapshot: {type: string, description: 'Snapshot of the source. Default: its latest.'}
        masker:
          type: string
          description: Name of the masking tool module, for example `greenmask`.
          examples: [greenmask]
        rules: {type: string, description: 'Masking rules, in the format the masking tool expects.'}
      required: [source, masker]
      additionalProperties: false
      example: {source: prod-raw, masker: greenmask, rules: '...'}
    BaseSql:
      type: object
      properties:
        sql: {type: string}
      required: [sql]
      additionalProperties: false
      example: {sql: INSERT INTO shop.products (name) VALUES ('new item');}
    LoadBase:
      type: object
      properties:
        dump: {type: string, description: 'An upload ID (`upload:...`) or a path on the base''s node.'}
        snapshot: {type: boolean, description: 'Take a snapshot after loading, so new branches see the data.'}
      required: [dump]
      additionalProperties: false
      example: {dump: 'upload:01JC8Z7R2K5M9T4V6X1B3N8Q0D', snapshot: true}
    Upload:
      type: object
      properties:
        id:
          type: string
          examples: ['upload:01JC8Z7R2K5M9T4V6X1B3N8Q0D']
        name: {type: string}
        size: {type: integer, format: int64}
        node: {type: string}
      required: [id, name, size, node]
      example:
        id: upload:01JC8Z7R2K5M9T4V6X1B3N8Q0D
        name: prod.sql.gz
        size: 104857600
        node: node1
    UploadRoom:
      type: object
      properties:
        node: {type: string}
        max_bytes: {type: integer, format: int64}
        reason:
          type: string
          enum: [limit, disk, pool]
          description: 'What limits the size: the `upload.max_mb` setting, the upload disk, or the ZFS pool.'
      required: [node, max_bytes, reason]
      example: {node: node1, max_bytes: 21474836480, reason: limit}
    RefreshSource:
      type: object
      properties:
        host: {type: string}
        port: {type: integer}
        user: {type: string}
        password_set: {type: boolean, description: A password is stored. It is never returned.}
        databases:
          type: array
          items: {type: string}
      required: [host, port, user, password_set, databases]
    Refresh:
      type: object
      properties:
        base: {$ref: '#/components/schemas/Name'}
        engine: {$ref: '#/components/schemas/Engine'}
        source: {$ref: '#/components/schemas/RefreshSource'}
        every:
          type: string
          description: The interval, as Go prints a duration.
          examples: [24h0m0s]
        updated_at: {type: string, format: date-time}
        last_run:
          type: [object, 'null']
          properties:
            started_at: {type: string, format: date-time}
            finished_at: {type: string, format: date-time}
            ok: {type: boolean}
            error:
              type: [string, 'null']
          required: [started_at, finished_at, ok, error]
        next_run: {type: string, format: date-time}
        operation:
          oneOf:
            - {$ref: '#/components/schemas/OperationRef'}
            - {type: 'null'}
          description: The refresh running now, if any.
      required: [base, engine, source, every, updated_at, last_run, next_run, operation]
      example:
        base: prod
        engine: postgres
        source:
          host: db.example.com
          port: 5432
          user: reader
          password_set: true
          databases: [app]
        every: 24h0m0s
        updated_at: '2026-11-09T12:00:00Z'
        last_run:
          started_at: '2026-11-10T03:00:00Z'
          finished_at: '2026-11-10T03:12:00Z'
          ok: true
          error: null
        next_run: '2026-11-11T03:00:00Z'
        operation: null
    PutRefresh:
      type: object
      properties:
        source:
          type: object
          properties:
            host: {type: string}
            port: {type: integer}
            user: {type: string}
            password: {type: string, description: Omit to keep the stored password.}
            databases:
              type: array
              items: {type: string}
          required: [host, port, user]
          additionalProperties: false
        every: {$ref: '#/components/schemas/Duration', description: 'Refresh interval, at least `1h`.'}
      required: [source, every]
      additionalProperties: false
      example:
        source:
          host: db.example.com
          port: 5432
          user: reader
          password: <password>
          databases: [app, billing]
        every: 24h
    PublicBaseList:
      type: object
      description: Ready bases that have a public snapshot and allow branches without a login.
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              name: {$ref: '#/components/schemas/Name'}
              runtime: {$ref: '#/components/schemas/RuntimeRef'}
              description: {type: string}
              snapshots:
                type: array
                items: {$ref: '#/components/schemas/Snapshot'}
                description: Only the public snapshots.
              anonymous:
                type: object
                properties:
                  max_branches: {type: integer}
                  max_ttl: {type: string}
                  branches: {type: integer}
                  remaining: {type: integer}
                required: [max_branches, max_ttl, branches, remaining]
                description: What this base allows without a login and how many branches are left.
            required: [name, runtime, description, snapshots, anonymous]
        anonymous:
          type: object
          properties:
            max_ttl: {type: string}
            max_branches: {type: integer}
            branches: {type: integer}
            rate_per_hour: {type: integer}
          required: [max_ttl, max_branches, branches, rate_per_hour]
          description: The cluster-wide limits for callers without a login.
      required: [items, anonymous]
      example:
        items:
          - name: demo
            runtime: postgres@18.6
            description: Sample shop data
            snapshots:
              - {name: s20261109, created_at: '2026-11-09T03:00:00Z', public: true}
            anonymous:
              max_branches: 10
              max_ttl: 24h0m0s
              branches: 2
              remaining: 8
        anonymous:
          max_ttl: 24h0m0s
          max_branches: 10
          branches: 2
          rate_per_hour: 5
    Runtime:
      type: object
      properties:
        runtime: {$ref: '#/components/schemas/RuntimeRef'}
        engine: {$ref: '#/components/schemas/Engine'}
        version: {type: string}
      required: [runtime, engine, version]
      example: {runtime: postgres@18.6, engine: postgres, version: '18.6'}
    RuntimeList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Runtime'}
        next_cursor: {type: 'null', description: 'Always null: lists are not paginated.'}
      required: [items, next_cursor]
    InstallRuntime:
      type: object
      properties:
        runtime: {$ref: '#/components/schemas/RuntimeRef'}
      required: [runtime]
      additionalProperties: false
      example: {runtime: postgres@18.6}
    NodeSystem:
      type: object
      description: What the node reports about its system. `unknown` for nodes of older versions.
      properties:
        distro:
          type: string
          examples: [ubuntu-26.04]
        os:
          type: string
          examples: [Ubuntu 26.04 LTS]
        kernel: {type: string}
        zfs: {type: string}
      required: [distro, os, kernel, zfs]
    NodeMetrics:
      type: object
      description: One performance sample of a node.
      properties:
        time: {type: string, format: date-time}
        cpu: {type: number, description: 'Share of CPU time in use since the previous sample, 0-100.'}
        load1: {type: number}
        mem_total: {type: integer, format: int64}
        mem_used: {type: integer, format: int64}
        net_rx: {type: number, description: Bytes per second over every interface but loopback.}
        net_tx: {type: number}
        arc: {type: integer, format: int64, description: ZFS cache size in bytes (0 without ZFS).}
      required: [time, cpu, load1, mem_total, mem_used, net_rx, net_tx, arc]
    SpaceNode:
      type: object
      description: A dataset or snapshot with its space use.
      properties:
        name: {type: string, description: 'Full name: tank/db-branch/bases/orders, or …/orders@s1 for a snapshot.'}
        kind: {type: string, enum: [filesystem, snapshot]}
        used: {type: integer, format: int64, description: 'A snapshot: the space only it holds (what destroying it frees). A dataset: everything below it, snapshots included.'}
        referenced: {type: integer, format: int64, description: 'The data it can see, including what it shares.'}
        used_by_snapshots: {type: integer, format: int64, description: 'A dataset: the part of used that its snapshots hold.'}
        origin: {type: string, description: 'A cloned dataset: the snapshot it was made from.'}
        clones: {type: array, items: {type: string}, description: 'A snapshot: the datasets cloned from it. It cannot be destroyed while any exist.'}
        created: {type: string, format: date-time}
      required: [name, kind, used, referenced, created]
    StorageReport:
      type: object
      description: What one node's storage holds.
      properties:
        node: {type: string}
        pool: {type: string}
        pool_size: {type: integer, format: int64}
        pool_free: {type: integer, format: int64}
        root: {type: string, description: The dataset db-branch keeps everything under.}
        nodes: {type: array, items: {$ref: '#/components/schemas/SpaceNode'}}
      required: [node, pool, pool_size, pool_free, root, nodes]
    NodeMetricsList:
      type: object
      description: The node's recent samples, oldest first.
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/NodeMetrics'}
        next_cursor: {type: 'null', description: 'Always null: lists are not paginated.'}
      required: [items, next_cursor]
    ServiceIDs:
      type: object
      description: The `db-branch` user and group ids. Zero means not known.
      properties:
        uid: {type: integer}
        gid: {type: integer}
      required: [uid, gid]
    ClusterNode:
      type: object
      properties:
        name: {type: string}
        host: {type: string}
        address: {type: string, description: 'Cluster address of the node (host:port).'}
        version: {type: string}
        leader: {type: boolean}
        voter:
          type: boolean
          description: Whether the node votes on cluster changes; the others only replicate.
        down: {type: boolean}
        last_seen:
          type: [string, 'null']
          format: date-time
        pool_size: {type: integer, format: int64}
        pool_free: {type: integer, format: int64}
        runtimes:
          type: array
          items: {$ref: '#/components/schemas/RuntimeRef'}
          description: Engines installed on the node.
        protocol: {type: integer, description: The newest cluster protocol the node speaks.}
        modules:
          type: array
          items: {type: string}
          description: Modules the node runs, as `name version`.
        metrics:
          oneOf:
            - {$ref: '#/components/schemas/NodeMetrics'}
            - {type: 'null'}
          description: The node's latest sample.
        arc_max_mb: {type: integer, format: int64, description: 'The ZFS ARC cap in effect on the node (0: unknown).'}
        arc_problem: {type: string, description: Why the `zfs.arc_max` setting could not be applied there.}
        system: {$ref: '#/components/schemas/NodeSystem'}
        service_ids: {$ref: '#/components/schemas/ServiceIDs'}
        id_problem:
          type: string
          description: How the node's db-branch uid/gid differ from the cluster's. Such a node takes no new branches or replicas until fixed (`db-branch cluster align-ids`).
      required:
        - name
        - host
        - address
        - version
        - leader
        - voter
        - down
        - last_seen
        - pool_size
        - pool_free
        - runtimes
        - protocol
        - modules
        - metrics
        - arc_max_mb
        - system
        - service_ids
    Cluster:
      type: object
      description: The cluster as this node sees it. A single node reports mode `single`.
      properties:
        mode:
          type: string
          enum: [single, cluster]
        self: {type: string, description: The name of the node that answered.}
        leader: {type: string}
        protocol:
          type: integer
          description: The cluster protocol every node speaks; features needing more wait for the remaining nodes to be upgraded.
        service_ids: {$ref: '#/components/schemas/ServiceIDs'}
        nodes:
          type: array
          items: {$ref: '#/components/schemas/ClusterNode'}
      required: [mode, self, leader, protocol, service_ids, nodes]
      example:
        mode: cluster
        leader: node1
        protocol: 17
        service_ids: {uid: 998, gid: 998}
        nodes:
          - name: node1
            host: node1
            address: 192.0.2.1:7070
            version: 0.2.0
            leader: true
            voter: true
            down: false
            last_seen: '2026-11-09T12:00:00Z'
            pool_size: 1000000000000
            pool_free: 640000000000
            runtimes: [postgres@18.6]
            protocol: 17
            modules: []
            metrics:
              time: '2026-11-09T12:00:00Z'
              cpu: 12.5
              load1: 0.4
              mem_total: 17179869184
              mem_used: 6442450944
              net_rx: 1200
              net_tx: 800
              arc: 2147483648
            arc_max_mb: 4096
            system:
              distro: ubuntu-26.04
              os: Ubuntu 26.04 LTS
              kernel: 6.14.0-example
              zfs: 2.3.1
            service_ids: {uid: 998, gid: 998}
    ClusterToken:
      type: object
      properties:
        token: {type: string, description: Join token. A new one invalidates the previous.}
      required: [token]
      example: {token: <join token>}
    ClusterNodeRemoval:
      type: object
      properties:
        branches: {type: array, items: {type: string}, description: Branches whose records were forgotten (they lived on the node).}
        bases: {type: array, items: {type: string}, description: Bases whose records were forgotten (their origin was on the node).}
        replicas: {type: array, items: {type: string}, description: Bases that kept a copy on the node (the reference was forgotten).}
        orphaned: {type: array, items: {type: string}, description: 'Forgotten bases that still have copies on other nodes (those datasets stay on disk there, unmanaged).'}
      required: [branches, bases, replicas, orphaned]
      example: {branches: [], bases: [], replicas: [], orphaned: []}
    Capabilities:
      type: object
      properties:
        version:
          type: string
          examples: [0.2.0]
        node: {type: string}
        modules:
          type: array
          items: {type: string}
          description: Loaded modules as `name version`.
        pages:
          type: array
          items:
            type: object
            properties:
              module: {type: string}
              path: {type: string}
              title: {type: string}
            required: [module, path, title]
          description: Console pages that modules add.
        record:
          type: boolean
          description: 'A branch can be created with `record: true` (a recording module is loaded and licensed).'
        warnings:
          type: array
          items: {type: string}
          description: Things the operator should know about, for example that a database engine module loaded without a signature (`allow_unsigned_runtimes`). Absent when there are none.
        engines:
          type: object
          description: |-
            The database engines this node can run, by name. Every feature is listed, true or false: a client shows or hides an action from it, and the API refuses an operation the engine does not offer with `409 feature_not_supported`.
          additionalProperties:
            type: object
            properties:
              display_name: {type: string, examples: [PostgreSQL]}
              collation_bound:
                type: boolean
                description: Copies of its data may only run on nodes of the same operating system release.
              protocols:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    primary: {type: boolean}
                  required: [name, primary]
              features:
                type: object
                description: 'By key: `query`, `checkpoints`, `live_freeze`, `upgrade`, `source_dump`, `branch_merge`, `history_record` (also needs a licensed recording module), `update_stats`, `instance_metrics`.'
                additionalProperties: {type: boolean}
            required: [display_name, collation_bound, protocols, features]
      required: [version, node, modules, pages, record, engines]
      example:
        version: 0.2.0
        node: node1
        modules: [history 0.2.0]
        pages: []
        record: true
        engines:
          mysql:
            display_name: MySQL
            collation_bound: false
            protocols: [{name: mysql, primary: true}]
            features: {query: true, checkpoints: true, live_freeze: false, upgrade: true, source_dump: true, branch_merge: false, history_record: true, update_stats: true, instance_metrics: false}
    Login:
      type: object
      description: The built-in login has one user, `admin`. Modules can add users and sign-in methods.
      properties:
        username: {type: string}
        password: {type: string}
      required: [username, password]
      additionalProperties: false
      example: {username: admin, password: <password>}
    Session:
      type: object
      properties:
        user:
          type: object
          properties:
            id: {type: string}
            name: {type: string}
            roles:
              type: array
              items: {type: string}
          required: [id, name, roles]
        csrf_token: {type: string, description: Send it as `X-CSRF-Token` on every request other than GET.}
        expires_at: {type: string, format: date-time}
        can_change_password: {type: boolean, description: False when a sign-in provider manages the password.}
        must_change_password: {type: boolean, description: 'True after signing in with an initial password (`db-branch init --evaluation`). Until it is changed with `PUT /v1/auth/password`, every other call except this one and `POST /v1/auth/logout` fails with 403 `password_change_required`.'}
        language:
          type: string
          description: The user's chosen console language (`en`, `ja`), empty to follow the browser.
        can:
          type: object
          additionalProperties: {type: boolean}
          description: Which console actions (for example `base.create`, `setting.write`, `ext.<module>.read`) the user may do.
        branch_prefix:
          type: string
          description: Put in front of the branch names this user creates on the user page, such as `alice-`. Empty for admins.
      required: [user, csrf_token, expires_at, can_change_password, language, can, branch_prefix]
      example:
        user:
          id: admin
          name: admin
          roles: [admin]
        csrf_token: <csrf token>
        expires_at: '2026-11-10T00:00:00Z'
        can_change_password: true
        language: ''
        can: {base.create: true, setting.write: true}
        branch_prefix: ''
    ChangePassword:
      type: object
      properties:
        current_password: {type: string}
        new_password: {type: string}
      required: [current_password, new_password]
      additionalProperties: false
    PasswordReset:
      type: object
      properties:
        password: {type: string, description: 'The new admin password, shown once.'}
      required: [password]
    LoginMethods:
      type: object
      description: Extra sign-in methods that modules provide (for example single sign-on).
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              module: {type: string}
              label: {type: string}
              url: {type: string, description: 'Where the sign-in starts, under `/v1/ext/<module>/`.'}
            required: [module, label, url]
      required: [items]
    Preferences:
      type: object
      properties:
        language:
          type: string
          enum: ['', en, ja]
          description: Empty follows the browser.
        languages:
          type: array
          items: {type: string}
      required: [language, languages]
      example:
        language: ja
        languages: [en, ja]
    PutPreferences:
      type: object
      properties:
        language:
          type: string
          enum: ['', en, ja]
      required: [language]
      additionalProperties: false
      example: {language: en}
    Token:
      type: object
      properties:
        id: {type: string}
        name: {type: string}
        scope:
          type: string
          enum: [full, branches]
        created_at: {type: string, format: date-time}
        expires_at:
          type: [string, 'null']
          format: date-time
        token:
          type: string
          description: The secret (`dbb_...`). Present only in the answer to its creation; only a hash is stored.
          examples: [dbb_<secret>]
      required: [id, name, scope, created_at, expires_at]
      example:
        id: tok_01JC9A1B2C3D4E5F6G7H8J9K0M
        name: ci-deploy
        scope: branches
        created_at: '2026-11-09T12:00:00Z'
        expires_at: '2026-12-09T12:00:00Z'
    TokenList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Token'}
        next_cursor: {type: 'null', description: 'Always null: lists are not paginated.'}
      required: [items, next_cursor]
    CreateToken:
      type: object
      properties:
        name: {type: string, description: A label.}
        scope:
          type: string
          enum: [full, branches]
          default: branches
        ttl:
          $ref: '#/components/schemas/Duration'
          description: Lifetime such as `720h`. Omit for no expiry.
      required: [name]
      additionalProperties: false
      example: {name: ci-deploy, scope: branches, ttl: 720h}
    CreatePersonalToken:
      type: object
      properties:
        name: {type: string}
        ttl: {$ref: '#/components/schemas/Duration'}
      required: [name]
      additionalProperties: false
      example: {name: my laptop, ttl: 720h}
    RouteUser:
      type: object
      properties:
        name: {type: string}
        default_branch: {$ref: '#/components/schemas/Name'}
      required: [name, default_branch]
      example: {name: app, default_branch: prod}
    RouteUserList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RouteUser'}
        next_cursor: {type: 'null', description: 'Always null: lists are not paginated.'}
      required: [items, next_cursor]
    PutRouteUser:
      type: object
      properties:
        password: {type: string}
        default_branch: {$ref: '#/components/schemas/Name'}
      required: [password, default_branch]
      additionalProperties: false
      example: {password: <password>, default_branch: prod}
    Setting:
      type: object
      properties:
        key:
          type: string
          examples: [branch.default_ttl]
        label: {type: string}
        help: {type: string}
        type:
          type: string
          enum: [string, int, bool, duration, secret]
        default: {type: string}
        value: {type: string, description: The current value. Always empty for `secret` settings.}
        secret_set: {type: boolean, description: Only on `secret` settings. Whether a value is stored (other than the default).}
        translations:
          type: object
          additionalProperties:
            type: object
            properties:
              label: {type: string}
              help: {type: string}
          description: Label and help by language.
      required: [key, label, type, default, value]
    SettingScope:
      type: object
      description: '`core` holds db-branch''s own settings; every module with settings has a scope of its own.'
      properties:
        scope:
          type: string
          examples: [core]
        title: {type: string}
        settings:
          type: array
          items: {$ref: '#/components/schemas/Setting'}
      required: [scope, title, settings]
      example:
        scope: core
        title: db-branch
        settings:
          - key: branch.default_ttl
            label: Default TTL
            help: 'Expiry for branches created without one, e.g. 72h. Empty: no expiry.'
            type: duration
            default: ''
            value: 72h
    SettingScopeList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/SettingScope'}
        next_cursor: {type: 'null', description: 'Always null: lists are not paginated.'}
      required: [items, next_cursor]
    PutSettings:
      type: object
      properties:
        values:
          type: object
          additionalProperties: {type: string}
          description: Setting keys and new values. Send only the keys to change. An empty secret keeps its value.
        clear:
          type: array
          items: {type: string}
          description: Secret setting keys to remove.
      additionalProperties: false
      example:
        values: {branch.default_ttl: 72h, backup.interval: 12h}
    ModuleSpec:
      type: object
      properties:
        name: {type: string}
        version: {type: string}
        wanted: {type: boolean}
      required: [name, version, wanted]
      example: {name: history, version: 0.2.0, wanted: true}
    Module:
      type: object
      properties:
        name: {type: string}
        version: {type: string}
        wanted: {type: boolean, description: The cluster wants the module on every node.}
        kind:
          type: string
          enum: [runtime]
          description: '`runtime` for a database engine (named `rt-<engine>`); absent for a plugin of the agent.'
        source:
          type: string
          enum: [apt, local]
          description: For a runtime module, whether the cluster installs its package (`apt`) or the operator puts it on each node (`local`).
        requires_license: {type: boolean, description: The module works only under a licence key (after the trial).}
        nodes:
          type: array
          items:
            type: object
            properties:
              node: {type: string}
              loaded: {type: string, description: 'The version running there (empty: none).'}
              current: {type: boolean}
              problem:
                type: string
                description: The module's complaint on that node, for example about the licence.
            required: [node, loaded, current]
      required: [name, version, wanted, requires_license, nodes]
    ModuleList:
      type: object
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Module'}
        available:
          type: object
          additionalProperties: {type: string}
          description: Modules the package repositories offer, with descriptions. Empty when offline.
      required: [items, available]
    InstallModule:
      type: object
      properties:
        name: {type: string}
        version: {type: string, description: Empty takes the latest.}
      required: [name]
      additionalProperties: false
      example: {name: history, version: ''}
    License:
      type: object
      description: What a licence key says. The key itself is never returned.
      properties:
        id: {type: string}
        customer: {type: string}
        modules:
          type: array
          items: {type: string}
        max_nodes: {type: integer, description: '0: no limit.'}
        issued_at: {type: string, format: date-time}
        expires: {type: string, format: date-time}
        grace_days: {type: integer, description: Days after `expires` the modules keep working (and warn).}
        plan: {type: string}
        billing:
          type: string
          enum: [monthly, yearly]
        subscription: {type: string}
        renew_url: {type: string}
      required: [id, customer, modules, max_nodes, issued_at, expires, grace_days]
    LicenseReport:
      type: object
      properties:
        license: {$ref: '#/components/schemas/License'}
        state:
          type: string
          enum: [valid, grace, expired, over_nodes]
        trial: {type: boolean, description: No key is saved; this is the trial.}
        all: {type: boolean, description: The key covers every module.}
        modules:
          type: array
          items: {type: string}
          description: Modules the key covers that the package repositories offer.
        unavailable:
          type: array
          items: {type: string}
          description: The ones they do not offer.
        enabled:
          type: array
          items: {type: string}
          description: Modules turned on by saving the key.
      required: [license, state, all, modules, unavailable, enabled]
    RenewalStatus:
      type: object
      description: What the cluster leader knows about renewing the saved key online.
      properties:
        enabled: {type: boolean, description: '`license.auto_renew` is on.'}
        last_attempt:
          type: [string, 'null']
          format: date-time
        last_result:
          type: string
          enum: [renewed, not_yet, inactive, error, unknown]
          description: '`unknown`: this node does not lead the cluster. Empty before the first attempt.'
        message: {type: string}
        next_attempt:
          type: [string, 'null']
          format: date-time
      required: [enabled]
    LicenseStatus:
      type: object
      properties:
        configured: {type: boolean, description: A key is saved.}
        renewal: {$ref: '#/components/schemas/RenewalStatus'}
        error: {type: string, description: Why the saved key cannot be used.}
        report: {$ref: '#/components/schemas/LicenseReport'}
      required: [configured]
      example: {configured: false}
    LicenseKey:
      type: object
      properties:
        key: {type: string, description: A licence key.}
      required: [key]
      additionalProperties: false
      example: {key: dbbl1.<licence key>}
    NodeUpdate:
      type: object
      properties:
        state:
          type: string
          enum: [pending, updating, done, failed]
        from: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        error: {type: string}
      required: [state]
    Rollout:
      type: object
      description: Moves the cluster's packages to a newer version, one node at a time. It stops at the first failed node and does not roll back.
      properties:
        id: {type: string}
        target: {type: string, description: The db-branch version every node ends on.}
        modules:
          type: object
          additionalProperties: {type: string}
          description: Module packages upgraded with it, by package.
        notes:
          type: array
          items: {type: string}
        order:
          type: array
          items: {type: string}
          description: 'The nodes in update order: followers first, the leader last.'
        nodes:
          type: object
          additionalProperties: {$ref: '#/components/schemas/NodeUpdate'}
        status:
          type: string
          enum: [running, done, failed, canceled]
        error: {type: string}
        by: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
      required: [id, target, order, nodes, status, started_at]
    UpdateView:
      type: object
      properties:
        checked_at: {type: string, format: date-time}
        checked_by: {type: string}
        nodes:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              leader: {type: boolean}
              down: {type: boolean}
              version: {type: string}
              modules:
                type: object
                additionalProperties: {type: string}
              update: {$ref: '#/components/schemas/NodeUpdate'}
            required: [name, leader, down, version, modules]
        packages:
          type: array
          items:
            type: object
            properties:
              name: {type: string}
              installed: {type: string, description: The oldest version in the cluster.}
              mixed: {type: boolean, description: The nodes do not all run `installed`.}
              available:
                type: array
                items:
                  type: object
                  properties:
                    version: {type: string}
                    kind:
                      type: string
                      enum: [minor, major]
                    requires: {type: string, description: The oldest db-branch the version works with.}
                  required: [version, kind]
            required: [name, installed, mixed, available]
        latest_minor: {type: string, description: 'The newest db-branch the console can update to (empty: none).'}
        rollout:
          oneOf:
            - {$ref: '#/components/schemas/Rollout'}
            - {type: 'null'}
      required: [checked_at, checked_by, nodes, packages, latest_minor, rollout]
    ApplyUpdate:
      type: object
      properties:
        target: {type: string, description: The db-branch version to move to.}
      required: [target]
      additionalProperties: false
      example: {target: 0.2.1}
    BackupFile:
      type: object
      properties:
        name:
          type: string
          examples: [db-branch-node1-20261109T120000Z.json.gz]
        size: {type: integer, format: int64}
        taken_at: {type: string, format: date-time}
      required: [name, size, taken_at]
    BackupList:
      type: object
      properties:
        node: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/BackupFile'}
      required: [node, items]
    RestoreSummary:
      type: object
      description: What a restore applied, and the records it left out because their data is not in the backup.
      properties:
        taken_at: {type: string, format: date-time}
        node: {type: string}
        settings: {type: integer}
        tokens: {type: integer}
        modules: {type: integer}
        module_data: {type: integer}
        route_users: {type: integer}
        runtimes: {type: integer}
        admin: {type: boolean}
        skipped_bases:
          type: array
          items: {type: string}
        skipped_branches:
          type: array
          items: {type: string}
      required:
        - taken_at
        - node
        - settings
        - tokens
        - modules
        - module_data
        - route_users
        - runtimes
        - admin
        - skipped_bases
        - skipped_branches
    McpRequest:
      type: object
      description: A JSON-RPC 2.0 message of the Model Context Protocol.
      properties:
        jsonrpc: {type: string, const: '2.0'}
        id:
          type: [string, integer]
        method:
          type: string
          examples: [tools/call]
        params: {type: object}
      required: [jsonrpc, method]
      example:
        jsonrpc: '2.0'
        id: 1
        method: tools/call
        params:
          name: list_branches
          arguments: {}
