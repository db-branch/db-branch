  /v1/bases/{name}/sql:
    post:
      tags: [bases]
      operationId: execBaseSql
      summary: Run SQL on a base
      x-dbb-action: base.sql
      x-dbb-token-scopes: [full]
      description: |-
        Runs SQL as the administrator on the base server (started if it is stopped), to change data before the next snapshot.

