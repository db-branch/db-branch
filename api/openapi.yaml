              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location: {$ref: '#/components/headers/Location'}
        '400':
          description: 'invalid_request: `dump` is empty.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 'not_found: no such base or upload.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: 'not_implemented: uploads are not available on this node.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/bases/{name}/refresh:
    get:
      tags: [refresh]
      operationId: getBaseRefresh
      summary: Get a base's refresh schedule
      x-dbb-action: base.refresh.read
      x-dbb-token-scopes: [full]
      description: |-
        Returns the schedule that refreshes the base from a source database. The source password is never returned.

        **Action:** `base.refresh.read`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - {$ref: '#/components/parameters/BaseName'}
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refresh'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 'not_found: no such base, or no schedule is set.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
    put:
      tags: [refresh]
      operationId: setBaseRefresh
      summary: Set a base's refresh schedule
      x-dbb-action: base.refresh
      x-dbb-token-scopes: [full]
      description: |-
        Refreshes the base from a source database on a schedule: dump the source, load it, take a snapshot. Without `source.password` the stored one stays.

        **Action:** `base.refresh`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - {$ref: '#/components/parameters/BaseName'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutRefresh'}
      responses:
        '200':
          description: The schedule.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Refresh'}
        '400':
          description: 'invalid_request: `every` is not a duration of at least 1h, or the source is invalid.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
    delete:
      tags: [refresh]
      operationId: deleteBaseRefresh
      summary: Turn a base's refresh schedule off
      x-dbb-action: base.refresh
      x-dbb-token-scopes: [full]
      description: |-
        Removes the schedule.

        **Action:** `base.refresh`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - {$ref: '#/components/parameters/BaseName'}
      responses:
        '204': {description: Done. No content.}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: not_found.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/bases/{name}/refresh/run:
    post:
      tags: [refresh]
      operationId: runBaseRefresh
      summary: Refresh a base now
      x-dbb-action: base.refresh
      x-dbb-token-scopes: [full]
      description: |-
        Refreshes the base from its source now, on the node holding it. Answers `202` with an operation of kind `base.refresh`.

        **Action:** `base.refresh`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - {$ref: '#/components/parameters/BaseName'}
      responses:
        '202':
          description: Accepted. Poll the operation or follow the event stream.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Operation'}
          headers:
            Location: {$ref: '#/components/headers/Location'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404':
          description: 'not_found: no such base, or no schedule is set.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/uploads:
    post:
      tags: [uploads]
      operationId: uploadDump
      summary: Upload a dump
      x-dbb-action: base.upload
      x-dbb-token-scopes: [full]
      description: |-
        The request body is the dump file itself (not JSON), for example a `.sql` or `.sql.gz` file. It needs a `Content-Length` header. The upload is stored on the node and the returned ID can be used as `dump` in createBase and loadBase until it is used; uploads stay on the node they were sent to. It is refused before anything is read when the size is unknown, over the limit (`upload.max_mb`), or larger than the space left.

        **Action:** `base.upload`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - name: name
          in: query
          description: The file name, such as `prod.sql.gz`.
          schema: {type: string}
        - {$ref: '#/components/parameters/NodeQuery'}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Stored.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Upload'}
        '400':
          description: 'invalid_request: for example an invalid file name.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '411':
          description: length_required.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '413':
          description: 'too_large: above the `upload.max_mb` setting.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '501':
          description: 'not_implemented: uploads are not available on this node.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
        '507':
          description: 'no_space: the disk or the ZFS pool has too little room.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /v1/uploads/room:
    get:
      tags: [uploads]
      operationId: getUploadRoom
      summary: Get the largest upload accepted
      x-dbb-action: base.upload
      x-dbb-token-scopes: [full]
      description: |-
        Tells a client, before it sends a dump, the largest one this node (or `?node=`) accepts now and what limits it.

        **Action:** `base.upload`. Needs a console session of an admin, the local socket, or a `full` token.
      parameters:
        - {$ref: '#/components/parameters/NodeQuery'}
      responses:
        '200':
          description: The room.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UploadRoom'}
        '401': {$ref: '#/components/responses/Unauthenticated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '501':
          description: 'not_implemented: uploads are not available on this node.'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /v1/runtimes:
