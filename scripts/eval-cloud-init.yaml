#cloud-config
# Evaluation VM for db-branch (Multipass): installs db-branch, makes a file-backed ZFS pool,
# initialises it, loads a small sample base (`shop`, MySQL 8.4, synthetic data), turns on the
# history module (the 30-day trial of the paid modules starts now), and writes the
# console URL and the sign-in (admin / admin, changed at the first sign-in) to /etc/motd.
# Not for real data: the pool is a file, and the first password is a known one.
write_files:
  - path: /var/lib/db-branch-eval/shop.sql
    permissions: '0644'
    content: |
      -- Sample data for the db-branch evaluation VM: a small shop (synthetic, generated here).
      CREATE DATABASE IF NOT EXISTS shop;
      USE shop;

      CREATE TABLE customers (
        id INT PRIMARY KEY AUTO_INCREMENT,
        name VARCHAR(100) NOT NULL,
        email VARCHAR(150) NOT NULL UNIQUE,
        created_at DATETIME NOT NULL
      );
      CREATE TABLE products (
        id INT PRIMARY KEY AUTO_INCREMENT,
        name VARCHAR(100) NOT NULL,
        price DECIMAL(10,2) NOT NULL
      );
      CREATE TABLE orders (
        id INT PRIMARY KEY AUTO_INCREMENT,
        customer_id INT NOT NULL,
        status VARCHAR(20) NOT NULL,
        created_at DATETIME NOT NULL,
        FOREIGN KEY (customer_id) REFERENCES customers (id)
      );
      CREATE TABLE order_items (
        order_id INT NOT NULL,
        product_id INT NOT NULL,
        quantity INT NOT NULL,
        PRIMARY KEY (order_id, product_id),
        FOREIGN KEY (order_id) REFERENCES orders (id),
        FOREIGN KEY (product_id) REFERENCES products (id)
      );

      SET SESSION cte_max_recursion_depth = 200000;

      INSERT INTO customers (name, email, created_at)
      WITH RECURSIVE n (i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 10000)
      SELECT CONCAT('Customer ', i), CONCAT('customer', i, '@example.com'), NOW() - INTERVAL (i MOD 365) DAY FROM n;

      INSERT INTO products (name, price)
      WITH RECURSIVE n (i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 100)
      SELECT CONCAT('Product ', i), 5 + (i MOD 20) * 2.5 FROM n;

      INSERT INTO orders (customer_id, status, created_at)
      WITH RECURSIVE n (i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 50000)
      SELECT 1 + (i * 7) MOD 10000, ELT(1 + i MOD 3, 'paid', 'shipped', 'delivered'), NOW() - INTERVAL (i MOD 300) DAY FROM n;

      INSERT INTO order_items (order_id, product_id, quantity)
      WITH RECURSIVE n (i) AS (SELECT 1 UNION ALL SELECT i + 1 FROM n WHERE i < 50000)
      SELECT i, 1 + (i * 13) MOD 100, 1 + i MOD 5 FROM n;
runcmd:
  - |
    set -e
    curl -fsSL https://apt.db-branch.com/db-branch.gpg | tee /usr/share/keyrings/db-branch.gpg >/dev/null
    echo "deb [signed-by=/usr/share/keyrings/db-branch.gpg] https://apt.db-branch.com stable main" > /etc/apt/sources.list.d/db-branch.list
    apt-get update
    DEBIAN_FRONTEND=noninteractive apt-get install -y db-branch
    truncate -s 20G /var/lib/db-branch-eval.img
    zpool create tank /var/lib/db-branch-eval.img
    db-branch init --pool tank --evaluation > /tmp/db-branch-init.txt 2>&1
    for i in $(seq 1 60); do db-branch runtime list >/dev/null 2>&1 && break; sleep 1; done
    db-branch runtime install mysql@8.4.13
    db-branch base create shop --runtime mysql@8.4.13 --dump /var/lib/db-branch-eval/shop.sql
    db-branch module install history
    for i in $(seq 1 60); do dpkg -s db-branch-history 2>/dev/null | grep -q "^Status: install ok installed" && break; sleep 2; done
    systemctl restart db-branch
    for i in $(seq 1 60); do db-branch module list 2>/dev/null | grep -q "history.*enabled 1/1" && break; sleep 2; done
    until_day=$(date -d '+30 days' +%F)
    ip=$(hostname -I | cut -d' ' -f1)
    {
      echo
      echo "db-branch evaluation VM"
      echo "  Console:  https://$ip:7080/  (self-signed certificate; admin console: /admin)"
      echo "  Base:     shop (MySQL 8.4, sample data). Try: sudo db-branch branch create try --base shop --ttl 1h --record"
      echo "  Trial:    the history module and the other paid modules run without a key until about $until_day"
      echo "  Pool:     file-backed, for evaluation only"
      echo
      cat /tmp/db-branch-init.txt
      echo
    } > /etc/motd
    rm -f /tmp/db-branch-init.txt
