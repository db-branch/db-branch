name: release

# Tag vX.Y.Z: build the packages for both architectures, sign the APT
# repository and publish it to https://apt.db-branch.com (a Cloudflare R2
# bucket), and build/sign/publish cross-platform client CLI archives to
# GitHub Releases. See docs/distribution.md and docs/client-cli.md.
#
# Signing keys and tokens are secrets of the "release" environment, which only
# jobs started by a v* tag on main can read.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: apt-publish
  cancel-in-progress: false

jobs:
  verify-tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: The tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main; not publishing"; exit 1; }

  deb:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
      - run: make vet cover
        if: matrix.goarch == 'amd64'
      - run: make deb-oss GOARCH=${{ matrix.goarch }}
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: deb-${{ matrix.goarch }}
          path: dist/*.deb

  publish:
    needs: [deb, verify-tag]
    runs-on: ubuntu-24.04
    environment: release
    env:
      # Secrets of the "release" environment.
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
      GPG_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: The tag must be on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main; not publishing"; exit 1; }
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: deb-*
          path: dist
          merge-multiple: true
      - name: Import the signing key and check it is the expected one
        run: |
          test -n "$APT_SIGNING_KEY" || { echo "secret APT_SIGNING_KEY is not set in the release environment"; exit 1; }
          test -s packaging/apt-signing-key.fpr || { echo "packaging/apt-signing-key.fpr is empty: put the fingerprint of the production signing key there"; exit 1; }
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
          want=$(tr -d ' \n' < packaging/apt-signing-key.fpr)
          [ "$fpr" = "$want" ] || { echo "imported key $fpr is not the pinned key $want"; exit 1; }
          echo "APT_KEY=$fpr" >> "$GITHUB_ENV"
      - name: Keep the versions that are already published
        run: scripts/apt-restore-pool.sh https://apt.db-branch.com dist/apt
      - name: Build and sign the repository
        run: make apt-repo APT_KEY="$APT_KEY"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: apt-repo
          path: dist/apt
      - name: Publish to R2
        run: python3 scripts/publish-apt.py dist/apt
      - name: Check the published repository like a user would
        run: |
          version=${GITHUB_REF_NAME#v}
          d=$(mktemp -d); mkdir -p "$d/lists/partial" "$d/cache/archives/partial"
          curl -fsSL https://apt.db-branch.com/db-branch.gpg -o "$d/key.gpg"
          echo "deb [signed-by=$d/key.gpg] https://apt.db-branch.com stable main" > "$d/s.list"
          o="-o Dir::Etc::sourcelist=$d/s.list -o Dir::Etc::sourceparts=/dev/null -o Dir::State::lists=$d/lists -o Dir::Cache=$d/cache -o APT::Sandbox::User="
          for i in 1 2 3 4 5 6; do
            apt-get $o update >/dev/null && apt-cache $o policy db-branch | grep -q "Candidate: $version" && ok=1 && break
            echo "not visible yet (indexes are cached for up to 60 s); retrying"; sleep 20
          done
          [ "${ok:-}" = 1 ] || { echo "db-branch $version is not in the published repository"; exit 1; }
          (cd "$d" && apt-get $o download "db-branch=$version")
          echo "published and verified: db-branch $version"

  client-build-linux:
    needs: verify-tag
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Build and package Linux client archive
        run: |
          version=${GITHUB_REF_NAME#v}
          scripts/package-client.sh "$version" linux "${{ matrix.goarch }}" dist/client
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: client-linux-${{ matrix.goarch }}
          path: dist/client/*

  client-build-darwin:
    needs: verify-tag
    runs-on: macos-15
    environment: release
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Build, codesign, notarize, and package macOS client archive
        run: |
          version=${GITHUB_REF_NAME#v}
          work="$(mktemp -d)"
          orig_kc="$(security list-keychains -d user | tr -d ' "' | tr '\n' ' ')"
          cleanup() {
            if [ -n "$orig_kc" ]; then
              # shellcheck disable=SC2086
              security list-keychains -d user -s $orig_kc >/dev/null 2>&1 || true
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT
          bin="$work/db-branch"
          CGO_ENABLED=0 GOOS=darwin GOARCH="${{ matrix.goarch }}" go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "$bin" ./cmd/db-branch-client
          if [ -n "$MACOS_CERT_P12" ] && [ -n "$MACOS_CERT_PASSWORD" ]; then
            kc="$work/build.keychain-db"
            kc_pw="$(openssl rand -hex 16)"
            printf '%s' "$MACOS_CERT_P12" | base64 --decode > "$work/cert.p12"
            security create-keychain -p "$kc_pw" "$kc"
            security set-keychain-settings -lut 21600 "$kc"
            security unlock-keychain -p "$kc_pw" "$kc"
            security import "$work/cert.p12" -k "$kc" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kc_pw" "$kc"
            # shellcheck disable=SC2086
            security list-keychains -d user -s $orig_kc "$kc"
            identity="$(security find-identity -v -p codesigning "$kc" | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
            test -n "$identity" || { echo "No Developer ID Application identity found in MACOS_CERT_P12"; exit 1; }
            codesign --force --options runtime --timestamp --sign "$identity" "$bin"
            codesign --verify --strict --verbose=2 "$bin"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              ditto -c -k --keepParent "$bin" "$work/notarize.zip"
              printf '%s\n' "$APPLE_APP_PASSWORD" | xcrun notarytool store-credentials "dbb-notary" --keychain "$kc" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID"
              notary_json="$work/notary.json"
              xcrun notarytool submit "$work/notarize.zip" --keychain "$kc" --keychain-profile "dbb-notary" --wait --output-format json > "$notary_json"
              cat "$notary_json"
              status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status",""))' "$notary_json")"
              sub_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("id",""))' "$notary_json")"
              if [ "$status" != "Accepted" ]; then
                if [ -n "$sub_id" ]; then
                  xcrun notarytool log "$sub_id" --keychain "$kc" --keychain-profile "dbb-notary" || true
                fi
                echo "macOS notarization failed with status: $status"
                exit 1
              fi
            else
              echo "::warning::APPLE_ID / APPLE_APP_PASSWORD / APPLE_TEAM_ID not set; skipping macOS notarization"
            fi
          else
            echo "::warning::MACOS_CERT_P12 or MACOS_CERT_PASSWORD not set; shipping unsigned macOS binary"
          fi
          scripts/package-client.sh "$version" darwin "${{ matrix.goarch }}" dist/client "$bin"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: client-darwin-${{ matrix.goarch }}
          path: dist/client/*

  client-build-windows:
    needs: verify-tag
    runs-on: windows-latest
    environment: release
    strategy:
      matrix:
        goarch: [amd64, arm64]
    env:
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go.mod
      - name: Build, sign, and package Windows client archive
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $stage = Join-Path $env:RUNNER_TEMP "win-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $bin = Join-Path $stage "db-branch.exe"
          $env:CGO_ENABLED = "0"
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.goarch }}"
          go build -trimpath -ldflags "-s -w -X main.version=$version" -o $bin ./cmd/db-branch-client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if ($env:WINDOWS_CERT_PFX -and $env:WINDOWS_CERT_PASSWORD) {
            $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            try {
              [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
              $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
              if (-not $signtool) { throw "signtool.exe not found" }
              & $signtool sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $bin
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally {
              Remove-Item -Force $pfx -ErrorAction SilentlyContinue
            }
          } else {
            Write-Output "::warning::WINDOWS_CERT_PFX or WINDOWS_CERT_PASSWORD not set; shipping unsigned Windows binary"
          }

          Copy-Item LICENSE, NOTICE, README.md $stage
          New-Item -ItemType Directory -Force -Path "dist/client" | Out-Null
          $zipPath = "dist/client/db-branch_${version}_windows_${{ matrix.goarch }}.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath -Force
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: client-windows-${{ matrix.goarch }}
          path: dist/client/*

  client-release:
    needs: [verify-tag, client-build-linux, client-build-darwin, client-build-windows]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
      GPG_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: client-*
          path: dist/client
          merge-multiple: true
      - name: Generate SHA256SUMS and optional GPG signature
        run: |
          (cd dist/client && sha256sum db-branch_*.tar.gz db-branch_*.zip > SHA256SUMS)
          if [ -n "$APT_SIGNING_KEY" ] && [ -s packaging/apt-signing-key.fpr ]; then
            printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
            fpr=$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr/ {print $10; exit}')
            want=$(tr -d ' \n' < packaging/apt-signing-key.fpr)
            if [ "$fpr" = "$want" ]; then
              if ! printf '%s\n' "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --armor --detach-sign -u "$fpr" -o dist/client/SHA256SUMS.asc dist/client/SHA256SUMS; then
                rm -f dist/client/SHA256SUMS.asc
                echo "::warning::GPG signing of SHA256SUMS failed (missing or invalid APT_SIGNING_PASSPHRASE?); continuing without SHA256SUMS.asc"
              fi
            else
              echo "::warning::imported GPG key $fpr does not match $want; skipping SHA256SUMS.asc"
            fi
          else
            echo "::warning::APT_SIGNING_KEY not set; skipping SHA256SUMS.asc signature"
          fi
      - name: Render Homebrew Formula and Scoop manifest
        run: |
          version=${GITHUB_REF_NAME#v}
          scripts/render-client-manifests.sh "$version" dist/client/SHA256SUMS dist/manifests
          cp dist/manifests/Formula/db-branch.rb dist/client/db-branch.rb
          cp dist/manifests/bucket/db-branch.json dist/client/db-branch.json
      - name: Upload client archives to GitHub Release
        run: |
          tag="$GITHUB_REF_NAME"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --generate-notes
          gh release upload "$tag" dist/client/* --clobber
      - name: Update Homebrew tap (optional)
        run: |
          version=${GITHUB_REF_NAME#v}
          scripts/push-manifest-repo.sh "https://github.com/db-branch/homebrew-tap.git" "$PWD/dist/manifests/Formula/db-branch.rb" "Formula/db-branch.rb" "$version" HOMEBREW_TAP_TOKEN
      - name: Update Scoop bucket (optional)
        run: |
          version=${GITHUB_REF_NAME#v}
          scripts/push-manifest-repo.sh "https://github.com/db-branch/scoop-bucket.git" "$PWD/dist/manifests/bucket/db-branch.json" "bucket/db-branch.json" "$version" SCOOP_BUCKET_TOKEN
