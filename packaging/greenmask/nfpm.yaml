# db-branch-greenmask: the free masker module that writes masked copies of
# PostgreSQL bases with Greenmask. Greenmask itself is installed separately.
name: db-branch-greenmask
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: database
priority: optional
maintainer: MaSuCcHI <MaSuCcHI@users.noreply.github.com>
description: |
  Greenmask masker for db-branch
  A db-branch module: `db-branch base mask <target> --from <base> --masker
  greenmask` copies a PostgreSQL base into another, transformed by
  Greenmask rules, and snapshots it. Install Greenmask v0.2 separately.
vendor: db-branch
homepage: https://github.com/db-branch/db-branch
license: Apache-2.0
depends:
  - db-branch
contents:
  - src: bin/db-branch-greenmask
    dst: /usr/lib/db-branch/modules/greenmask
    file_info:
      mode: 0755
  - src: packaging/greenmask/copyright
    dst: /usr/share/doc/db-branch-greenmask/copyright
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/proxysql/restart-agent
  postremove: packaging/proxysql/restart-agent
