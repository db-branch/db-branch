# db-branch configuration. Every key is optional; defaults are shown.

# ZFS pool managed by db-branch. Set by `db-branch init --pool <name>`.
# pool = ""

# data_dir = "/var/lib/db-branch"

# Host name or IP clients use to reach this node (in connection URLs).
# Empty: the first non-loopback IPv4 address.
# advertise = ""

# Address database servers listen on.
# bind = "0.0.0.0"
# socket   = "/run/db-branch/agent.sock"

# Let database engine modules (runtime modules) without a valid signature load.
# For development and testing only: a warning is logged. A bad signature is never accepted.
# allow_unsigned_runtimes = false

[ports]
# Ports handed to bases and branches.
# min = 40000
# max = 40999

[branch]
# Engine cache per branch (InnoDB buffer pool / shared_buffers), in MB.
# memory_mb = 128

[zfs]
# Cap on the ZFS ARC, applied by `db-branch init`. 0: a quarter of memory.
# arc_max_mb = 0

[console]
# listen = ":7080"
# Console HTTPS requires TLS 1.3. When tls_cert and tls_key are omitted, a
# self-signed certificate valid for up to 825 days is generated under
# data_dir/tls (existing certificates exceeding 825 days are regenerated on
# startup). Set both tls_cert and tls_key to PEM files to use your own
# certificate; updates to those files are reloaded without restarting.
# tls_cert = ""
# tls_key = ""

[notify]
# Allow Slack / webhook notifications to reach private network addresses (RFC 1918 / IPv6 ULA).
# Loopback and link-local addresses (e.g. cloud metadata) are always refused.
# allow_private_ips = false

